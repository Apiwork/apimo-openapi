  # PROPERTY - Provider
  # ─────────────────────────────────────────
  /agencies/{agency_id}/properties/{property_id}/provider:
    put:
      operationId: updatePropertyProvider
      tags: [Property Provider]
      summary: Update information related to the publishing of the property
      description: "Met à jour les informations de publication d'un bien sur un portail partenaire (URL et date de publication)."
      parameters:
        - name: agency_id
          in: path
          required: true

        required: true
      responses:
        "200":
          description: Media added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_6"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/properties/{property_id}/medias/{media_id}:
    delete:
      tags:
      - Property Media
      summary: Delete a media from a property
      operationId: deletePropertyMedia
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      - name: property_id
        in: path
        required: true
        schema:
          type: integer
      - name: media_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: MMedia deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_5"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/properties/{property_id}/documents:
    post:
      tags:
      - Property Media
      summary: Add a document to a property
      operationId: addPropertyDocument
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      - name: property_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/property_id_documents_body"
        required: true
      responses:
        "200":
          description: Document added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_7"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/properties/{property_id}/documents/{document_id}:
    delete:
      tags:
      - Property Media
      summary: Delete a document from a property
      operationId: deletePropertyDocument
      parameters:
      - name: agency_id

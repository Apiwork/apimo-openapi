      parameters:
        - name: agency_id
          in: path
          required: true
          schema: { type: integer }
        - name: property_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: integer
                  description: "Référence unique du portail partenaire"
                  example: 100
                step:
                  type: integer
                  description: "1 = actif, 2 = inactif"

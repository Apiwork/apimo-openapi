openapi: 3.0.3 
info:
  title: Apimo Webservice API
  description: |
    Complete documentation for the Apimo API for real estate service providers.
    Access agencies, properties, contacts, leads, and settings.

    **Authentication**: HTTP Basic Auth with `provider_id:token`

    > ⚠️ **Note on error codes**: The documented HTTP codes (401, 403, 404, 422, 500)
    > follow standard REST conventions. If in doubt, refer to the logs of your actual requests.
  contact:
    name: Apimo Support
    mail: support@apimo.com
  version: 3.0.0
servers:
- url: https://virtserver.swaggerhub.com/apimo-8ef/Api3/1.0.0
  description: SwaggerHub API Auto Mocking
- url: https://api.apimo.pro
  description: Serveur de production
security:
- basicAuth: []
tags:
- name: Catalogs
  description: Value frameworks (types of assets, statuses, categories, etc.)
- name: Agencies
  description: Agencies and business units
- name: Properties
  description: Real estate properties (listings)
- name: Property Media
  description: "Media attached to a property (photos, videos, documents)"
- name: Contacts
  description: Client contacts at the agency
- name: Leads
  description: Leads and incoming requests
- name: Requests
  description: Search requests
- name: Actions
  description: Actions and activities
- name: Contracts
  description: Contracts (mandates, rentals...)
- name: Residences
  description: New residential buildings and programs
- name: Users
  description: Users and negotiators of the agency
paths:
  /catalogs:
    get:
      tags:
      - Catalogs
      summary: Get a list of catalogs
      operationId: listCatalogs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /catalogs/{catalog_id}:
    get:
      tags:
      - Catalogs
      summary: Get a specific catalog
      operationId: getCatalog
      parameters:
      - name: catalog_id
        in: path
        description: "Catalog's name (ex: property_type, property_category...)"
        required: true
        schema:
          type: string
      - name: culture
        in: query
        description: "Culture (ISO 639-1)"
        required: false
        schema:
          type: string
          example: fr
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies:
    get:
      tags:
      - Agencies
      summary: Retrieve the business units list
      description: |
        Returns the paginated list of agencies.

        **Classic Pagination:**
        Use `limit` and `offset` to browse the results.
        The `total_items` field in the response indicates the total number of agencies.
        If it is greater than `offset + limit`, there are more pages to retrieve.

        Example to browse 2500 agencies with limit=1000:
        - Page 1 : `?limit=1000&offset=0`
        - Page 2 : `?limit=1000&offset=1000`
        - Page 3 : `?limit=1000&offset=2000`
      operationId: listAgencies
      parameters:
      - name: limit
        in: query
        description: "Number of records to return (max: 1000)"
        required: false
        schema:
          maximum: 1000
          type: integer
          default: 1000
      - name: offset
        in: query
        description: "Number of records to skip"
        required: false
        schema:
          type: integer
          default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/properties:
    get:
      tags:
      - Properties
      summary: Retrieve the properties list
      description: |
        Returns the paginated list of properties for an agency.

        **Classic Pagination:**
        Use `limit` and `offset` to browse the results.
        The `total_items` field in the response indicates the total number of properties.
        If it is greater than `offset + limit`, there are more pages to retrieve.

        Example to browse 2500 properties with limit=1000:
        - Page 1 : `?limit=1000&offset=0`
        - Page 2 : `?limit=1000&offset=1000`
        - Page 3 : `?limit=1000&offset=2000`

        **Synchronisation incrémentale (recommandée) :**
        Pass the `timestamp` field returned by the last response to
        retrieve only the items created or modified since that date.
        Ideal for keeping a local database in sync without reloading everything.

        Example : `?timestamp=1712000000`
      operationId: listProperties
      parameters:
      - name: agency_id
        in: path
        description: Unique identifier of the agency
        required: true
        schema:
          type: integer
      - name: limit
        in: query
        description: "Number of records to return (max: 1000)"
        required: false
        schema:
          maximum: 1000
          type: integer
          default: 1000
      - name: offset
        in: query
        description: "Number of records to skip"
        required: false
        schema:
          type: integer
          default: 0
      - name: timestamp
        in: query
        description: Returns the properties created or modified since this UNIX timestamp
        required: false
        schema:
          type: integer
      - name: step
        in: query
        description: Filter by step → see catalog property_step
        required: false
        schema:
          type: integer
      - name: status
        in: query
        description: Filter by status → see catalog property_status
        required: false
        schema:
          type: integer
      - name: group
        in: query
        description: Filter by group → see catalog property_group
        required: false
        schema:
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_1"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
      - Properties
      summary: Create a new property
      operationId: createProperty
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Property"
        required: true
      responses:
        "200":
          description: Property created - returns the ID and dates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_2"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/properties/{property_id}:
    put:
      tags:
      - Properties
      summary: Update a property
      operationId: updateProperty
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      - name: property_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Property"
        required: true
      responses:
        "200":
          description: Property updated - returns the ID and dates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_3"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/properties/{property_id}/pictures:
    post:
      tags:
      - Property Media
      summary: Upload a picture for a property
      operationId: uploadPropertyPicture
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      - name: property_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/property_id_pictures_body"
        required: true
      responses:
        "200":
          description: picture uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_4"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/properties/{property_id}/pictures/{picture_id}:
    delete:
      tags:
      - Property Media
      summary: Delete a picture from a property
      operationId: deletePropertyPicture
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      - name: property_id
        in: path
        required: true
        schema:
          type: integer
      - name: picture_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Picture deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_5"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/properties/{property_id}/medias:
    post:
      tags:
      - Property Media
      summary: "Add or embed a media (virtual tour, video...)"
      operationId: addPropertyMedia
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      - name: property_id

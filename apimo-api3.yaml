            subscription:
              type: string
              description: "Abonnement à l'emailing → voir catalog subscription"
              example: "1"
            last_at:
              type: string
              format: date-time
              nullable: true
              description: "Date du dernier envoi d'emailing"
        category:
          type: string
          description: "Catégorie du bien recherché → voir catalog property_category (ex: '1'=Vente, '2'=Location)"
          example: "1"
        subcategory:
          type: string
          nullable: true
          description: "Sous-catégorie → voir catalog property_subcategory"
        types:
          type: array
          description: "Types de biens recherchés → voir catalog property_type"
          items:
            type: string
          example: ["1", "2"]
        subtype:
          type: string
          nullable: true
          description: "Sous-type → voir catalog property_subtype"
        referral:
          type: string
          nullable: true
          description: "Origine de la recherche → voir catalog origine"
        subreferral:
          type: string
          nullable: true
          description: "Sous-origine de la recherche"
        country:
          type: string
          description: "Code pays ISO 3166-1 alpha-2"
          example: "FR"
        locations:
          type: array
          description: "Zones géographiques de la recherche"
          items:
            type: object
            properties:
              region:
                type: object
                nullable: true
                description: "Région"

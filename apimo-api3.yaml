  # CATALOGS
  # ─────────────────────────────────────────
  /catalogs:
    get:
      tags: [Catalogs]
      operationId: listCatalogs
      summary: Get a list of catalogs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogList' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /catalogs/{catalog_id}:
    get:
      tags: [Catalogs]
      operationId: getCatalog
      summary: Get a specific catalog
      parameters:
        - name: catalog_id
          in: path
          required: true
          schema: { type: string }
          description: "Nom du catalogue (ex: property_type, property_category...)"
        - name: culture
          in: query
          schema: { type: string, example: "fr" }
          description: "Langue des libellés (ISO 639-1)"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogEntry' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ─────────────────────────────────────────
  # AGENCIES
  # ─────────────────────────────────────────
  /agencies:
    get:
      tags: [Agencies]
      operationId: listAgencies
      summary: Retrieve the business units list
      description: |
        Retourne la liste paginée des agences.

        **Pagination classique :**
        Utilisez `limit` et `offset` pour parcourir les résultats.
        Le champ `total_items` dans la réponse indique le nombre total d'agences.
        S'il est supérieur à `offset + limit`, il reste des pages à récupérer.

        Exemple pour parcourir 2500 agences avec limit=1000 :
        - Page 1 : `?limit=1000&offset=0`
        - Page 2 : `?limit=1000&offset=1000`
        - Page 3 : `?limit=1000&offset=2000`
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 1000, maximum: 1000 }
          description: "Nombre d'enregistrements à retourner (max: 1000)"
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
          description: "Nombre d'enregistrements à ignorer"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      agencies:
                        type: array
                        items: { $ref: '#/components/schemas/Agency' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ─────────────────────────────────────────
  # PROPERTIES
  # ─────────────────────────────────────────
  /agencies/{agency_id}/properties:
    get:
      tags: [Properties]
      operationId: listProperties
      summary: Retrieve the properties list
      description: |
        Retourne la liste paginée des biens d'une agence.

        **Pagination classique :**
        Utilisez `limit` et `offset` pour parcourir les résultats.
        Le champ `total_items` dans la réponse indique le nombre total de biens.
        S'il est supérieur à `offset + limit`, il reste des pages à récupérer.

        Exemple pour parcourir 2500 biens avec limit=1000 :
        - Page 1 : `?limit=1000&offset=0`
        - Page 2 : `?limit=1000&offset=1000`
        - Page 3 : `?limit=1000&offset=2000`

        **Synchronisation incrémentale (recommandée) :**
        Passez le champ `timestamp` retourné par la dernière réponse pour ne
        récupérer que les biens créés ou modifiés depuis cette date.
        Idéal pour maintenir une base locale synchronisée sans tout recharger.

        Exemple : `?timestamp=1712000000`
      parameters:
        - name: agency_id
          in: path
          required: true
          schema: { type: integer }
          description: "Identifiant unique de l'agence"
        - name: limit
          in: query
          schema: { type: integer, default: 1000, maximum: 1000 }
          description: "Nombre d'enregistrements à retourner (max: 1000)"
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
          description: "Nombre d'enregistrements à ignorer"
        - name: timestamp
          in: query
          schema: { type: integer }
          description: "Retourne les biens créés ou modifiés depuis ce timestamp UNIX"
        - name: step
          in: query
          schema: { type: integer }
          description: "Filtrer par step → voir catalog property_step"
        - name: status
          in: query
          schema: { type: integer }
          description: "Filtrer par statut → voir catalog property_status"
        - name: group
          in: query
          schema: { type: integer }
          description: "Filtrer par groupe → voir catalog property_group"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      properties:
                        type: array
                        items: { $ref: '#/components/schemas/Property' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Properties]
      operationId: createProperty
      summary: Create a new property
      parameters:
        - name: agency_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Property' }
      responses:
        '200':
          description: "Bien créé - retourne l'ID et les dates"
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 19344239
                  created_at:
                    type: string
                    format: date-time
                    example: "2020-02-18T15:02:34Z"
                  updated_at:
                    type: string
                    format: date-time
                    example: "2020-02-18T15:52:26Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /agencies/{agency_id}/properties/{property_id}:
    put:
      tags: [Properties]
      operationId: updateProperty
      summary: Update a property
      parameters:
        - name: agency_id
          in: path
          required: true
          schema: { type: integer }
        - name: property_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Property' }
      responses:
        '200':
          description: "Bien mis à jour"
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 19344239
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'


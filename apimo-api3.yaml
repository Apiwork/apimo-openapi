      description: Erreur
      properties:
        status:
          type: integer
          description: Code HTTP
          example: 403
        title:
          type: string
          description: Libellé de l'erreur
          example: Forbidden
        detail:
          type: string
          description: Détail de l'erreur
          example: You need the scope "properties_write".


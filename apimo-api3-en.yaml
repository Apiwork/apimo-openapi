          type: integer
      responses:
        "200":
          description: Document deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_5"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/properties/{property_id}/comments:
    post:
      tags:
      - Property Media
      summary: Add or update a multilingual description
      operationId: upsertPropertyComment
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      - name: property_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/property_id_comments_body"
        required: true
      responses:
        "200":
          description: Comment added/updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_6"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/properties/{property_id}/crossings:
    get:
      tags:
      - Properties
      summary: Get matched requests (crossings) for a property
      description: |
        Returns the paginated list of matches (requests matching this property).

        **Incremental Synchronization:**
        Pass the `timestamp` field returned by the last response to only
        retrieve matches updated since this date.
      operationId: listPropertyCrossings
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      - name: property_id
        in: path
        required: true
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        schema:
          maximum: 10000
          type: integer
          default: 10000
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
      - name: timestamp
        in: query
        required: false
        schema:
          type: integer
      - name: step
        in: query
        description: Filter by step 
        required: false
        schema:
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_8"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/contacts:
    get:
      tags:
      - Contacts
      summary: Retrieve the contacts list
      description: |
        Returns the paginated list of contacts for an agency.

        **Classic Pagination:**
        Use `limit` and `offset` to navigate through the results.
        The `total_items` field indicates the total number of contacts.

        **Incremental Synchronization (Recommended):**
        Pass the `timestamp` field returned by the last response to only
        retrieve contacts created or modified since this date.
      operationId: listContacts
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        schema:
          maximum: 10000
          type: integer
          default: 10000
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
      - name: timestamp
        in: query
        required: false
        schema:
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_9"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
      - Contacts
      summary: Create a new contact
      operationId: createContact
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Contact"
        required: true
      responses:
        "200":
          description: Contact created - only returns the ID and dates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_10"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/leads:
    get:
      tags:
      - Leads
      summary: Retrieve the leads list
      description: |
        Returns the paginated list of leads for an agency.

        **Classic Pagination:**
        Use `limit` and `offset` to navigate through the results.
        The `total_items` field indicates the total number of leads.

        **Incremental Synchronization (Recommended):**
        Pass the `timestamp` field returned by the last response to only
        retrieve leads created or modified since this date.
      operationId: listLeads
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        schema:
          maximum: 10000
          type: integer
          default: 10000
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
      - name: timestamp
        in: query
        required: false
        schema:
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_11"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
      - Leads
      summary: Create a new lead
      operationId: createLead
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Lead"
        required: true
      responses:
        "200":
          description: Lead created
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/contacts/{contact_id}/actions:
    get:
      tags:
      - Contacts
      summary: Retrieve contact actions history
      description: Retrieve all actions history for a specific contact in an agency.
      operationId: getContactActions
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      - name: contact_id
        in: path
        required: true
        schema:
          type: integer
      - name: user_id
        in: query
        description: Filter actions by a specific user
        required: false
        schema:
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/contacts/{contact_id}/actions/{year}:
    get:
      tags:
      - Contacts
      summary: Retrieve contact actions history filtered by year
      description: Retrieve all actions history for a specific contact in an agency filtered by year.
      operationId: getContactActionsByYear

          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Nombre total d'éléments (avant pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: Timestamp UNIX de la mise à jour la plus récente de la page (à repasser en paramètre `timestamp` pour la synchro incrémentale)
                  actions:
                    type: array
                    description: Actions
                    items: {$ref: '#/components/schemas/Action'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/contacts/{contact_id}/actions/{year}:
    get:
      tags: [Contacts]
      operationId: listContactActionsByYear
      summary: List a contact's actions for a year
      description: |
        Comme `GET .../contacts/{contact_id}/actions`, limité aux actions datées de l'année indiquée.

        **Scope** : `actions`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/ContactId'}
      - {$ref: '#/components/parameters/Year'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - {$ref: '#/components/parameters/Timestamp'}
      - name: type[]
        in: query
        schema:
          type: array
          items: {type: integer}
        description: Types d'action
        style: form
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Nombre total d'éléments (avant pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: Timestamp UNIX de la mise à jour la plus récente de la page (à repasser en paramètre `timestamp` pour la synchro incrémentale)
                  actions:
                    type: array
                    description: Actions
                    items: {$ref: '#/components/schemas/Action'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ─────────────────────────────────────────
  # REQUESTS
  # ─────────────────────────────────────────
  /agencies/{agency_id}/requests:
    get:
      tags: [Requests]
      operationId: listRequests
      summary: List the search requests
      description: |
        Liste les demandes de recherche de l'agence (actives et inactives). Liste paginée, triée par date de mise à jour croissante. Pour une synchronisation incrémentale, repassez dans `timestamp` la valeur `timestamp` reçue lors de l'appel précédent.

        **Scope** : `requests`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - {$ref: '#/components/parameters/Timestamp'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Nombre total d'éléments (avant pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: Timestamp UNIX de la mise à jour la plus récente de la page (à repasser en paramètre `timestamp` pour la synchro incrémentale)
                  requests:
                    type: array
                    description: Demandes
                    items: {$ref: '#/components/schemas/Request'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

    post:
      tags: [Requests]
      operationId: createRequest
      summary: Create a search request
      description: |
        Crée une demande de recherche pour un contact de l'agence. Si `id` est fourni, met à jour cette demande.

        **Scope** : `requests_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - {$ref: '#/components/schemas/RequestInput'}
              required: [contact, user]
            example:
              contact: 220351
              user: 3896
              category: 1
              types: [1, 2]
              country: FR
              locations:
              - Nice
              - {city: Antibes}
              rooms_operator: 2
              rooms: 3
              price: {max: 400000, currency: EUR}
      responses:
        '200':
          description: Demande créée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WriteResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/requests/{request_id}:
    get:
      tags: [Requests]
      operationId: getRequest
      summary: Get a search request
      description: |
        Retourne une demande, dans la même enveloppe que la liste (`requests` contient un élément ; vide si introuvable).

        **Scope** : `requests`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/RequestId'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Nombre total d'éléments (avant pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: Timestamp UNIX de la mise à jour la plus récente de la page (à repasser en paramètre `timestamp` pour la synchro incrémentale)
                  requests:
                    type: array
                    description: Demandes
                    items: {$ref: '#/components/schemas/Request'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

    put:
      tags: [Requests]
      operationId: updateRequest
      summary: Update a search request
      description: |
        Met à jour une demande de l'agence. Attention : sans `country`, le pays est remis à celui de l'agence.

        **Scope** : `requests_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/RequestId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RequestInput'}
            example: {active: false}
      responses:
        '200':
          description: Demande mise à jour
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WriteResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/requests/{request_id}/crossings:
    get:
      tags: [Requests]
      operationId: listRequestCrossings
      summary: List the properties matching a request
      description: |
        Liste les biens rapprochés avec cette demande (biens de l'agence, de sa société ou de son réseau). Liste paginée, triée par date de mise à jour croissante. Pour une synchronisation incrémentale, repassez dans `timestamp` la valeur `timestamp` reçue lors de l'appel précédent.

        **Scope** : `requests`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/RequestId'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - {$ref: '#/components/parameters/Timestamp'}
      - name: step[]
        in: query
        schema:
          type: array
          items: {type: integer}
        description: Étapes du rapprochement
        style: form
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Nombre total d'éléments (avant pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: Timestamp UNIX de la mise à jour la plus récente de la page (à repasser en paramètre `timestamp` pour la synchro incrémentale)
                  crossings:
                    type: array
                    description: Rapprochements
                    items: {$ref: '#/components/schemas/RequestCrossing'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ─────────────────────────────────────────
  # LEADS
  # ─────────────────────────────────────────
  /agencies/{agency_id}/leads:
    get:
      tags: [Leads]
      operationId: listLeads
      summary: List the leads
      description: |
        Liste tous les leads de l'agence, quelle que soit leur source. Liste paginée, triée par date de mise à jour croissante. Pour une synchronisation incrémentale, repassez dans `timestamp` la valeur `timestamp` reçue lors de l'appel précédent.

        **Scope** : `leads`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - {$ref: '#/components/parameters/Timestamp'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Nombre total d'éléments (avant pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: Timestamp UNIX de la mise à jour la plus récente de la page (à repasser en paramètre `timestamp` pour la synchro incrémentale)
                  leads:
                    type: array
                    description: Leads
                    items: {$ref: '#/components/schemas/Lead'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

    post:
      tags: [Leads]
      operationId: createLead
      summary: Send a lead
      description: |
        Envoie un lead à l'agence (non décompté du quota). Un e-mail d'alerte est envoyé à l'agence pour un nouveau lead de type 1, 2, 3 ou 6, sauf avec `no_alert`. Si vous avez déjà envoyé cette `reference` pour l'agence, le lead existant est mis à jour (et remplacé, voir `LeadInput`). L'envoi est ouvert sans connexion avec l'agence ; mettre à jour un lead par son `id` nécessite une connexion active.

        **Scope** : `leads_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - {$ref: '#/components/schemas/LeadInput'}
              required: [reference]
            example:
              reference: 194D1DDEDdE
              type: 1
              firstname: Jean
              lastname: Dupont
              email: user@example.com
              phone: '+33611111111'
              language: fr
              message: Bonjour, ce bien est-il toujours disponible ?
              property_reference: '24367'
              date: '2024-06-15 14:30:00'
      responses:
        '200':
          description: Lead créé ou mis à jour
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WriteResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}

  /agencies/{agency_id}/leads/{lead_id}:
    get:
      tags: [Leads]
      operationId: getLead
      summary: Get a lead
      description: |
        Retourne un lead, dans la même enveloppe que la liste (`leads` contient un élément ; vide si introuvable).

        **Scope** : `leads`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/LeadId'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Nombre total d'éléments (avant pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: Timestamp UNIX de la mise à jour la plus récente de la page (à repasser en paramètre `timestamp` pour la synchro incrémentale)
                  leads:
                    type: array
                    description: Leads
                    items: {$ref: '#/components/schemas/Lead'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

    put:
      tags: [Leads]
      operationId: updateLead
      summary: Update a lead
      description: |
        Met à jour un lead de l'agence (connexion active avec l'agence requise). **Les champs non envoyés sont vidés** (voir `LeadInput`).

        **Scope** : `leads_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/LeadId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LeadInput'}
            example:
              step: 4
              firstname: Jean
              lastname: Dupont
              email: user@example.com
              date: '2024-06-15 14:30:00'
      responses:
        '200':
          description: Lead mis à jour
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WriteResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}

  # ─────────────────────────────────────────
  # ACTIONS
  # ─────────────────────────────────────────
  /agencies/{agency_id}/actions:
    post:
      tags: [Actions]
      operationId: createAction
      summary: Create an action
      description: |
        Crée une action (rendez-vous, appel, e-mail, visite...) pour un utilisateur, liée à un contact et/ou des biens. Pour lire les actions : `GET .../users/{user_id}/actions` ou `GET .../contacts/{contact_id}/actions`.

        **Scope** : `actions_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - {$ref: '#/components/schemas/ActionInput'}
              required: [type, user, date]
            example:
              type: 15
              method: 6
              user: 3896
              contact: 220351
              date: '2024-06-15'
              time_start: '14:30'
              time_end: '15:30'
              subject: Visite appartement centre-ville
              properties: [181297]
      responses:
        '200':
          description: Action créée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/actions/{action_id}:
    put:
      tags: [Actions]
      operationId: updateAction
      summary: Update an action
      description: |
        Met à jour une action d'un utilisateur de l'agence.

        **Scope** : `actions_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/ActionId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActionInput'}
            example:
              content: Le client souhaite une deuxième visite.
              properties:
              - {id: 181297, rating: 4}
      responses:
        '200':
          description: Action mise à jour
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ─────────────────────────────────────────
  # CONTRACTS
  # ─────────────────────────────────────────
  /agencies/{agency_id}/contracts:
    get:
      tags: [Contracts]
      operationId: listContracts
      summary: List the contracts
      description: |
        Liste les contrats (ventes, locations) de l'agence. Liste paginée, triée par date de mise à jour croissante. Pour une synchronisation incrémentale, repassez dans `timestamp` la valeur `timestamp` reçue lors de l'appel précédent.

        **Scope** : `contracts`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - {$ref: '#/components/parameters/Timestamp'}
      - name: with
        in: query
        schema:
          type: string
          enum: [logs]
        description: '`logs` : historique des modifications'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Nombre total d'éléments (avant pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: Timestamp UNIX de la mise à jour la plus récente de la page (à repasser en paramètre `timestamp` pour la synchro incrémentale)
                  contracts:
                    type: array
                    description: Contrats
                    items: {$ref: '#/components/schemas/Contract'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

    post:
      tags: [Contracts]
      operationId: createContract
      summary: Create a contract
      description: |
        Crée un contrat (chaque appel crée un nouveau contrat).

        **Scope** : `contracts_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - {$ref: '#/components/schemas/ContractInput'}
              required: [price]
            example:
              step: 2
              property: 181297
              price: 250000
              currency: EUR
              commission: 12500
              commitment_at: '2024-06-15'
              contacts:
              - {contact: 220351, type: 1}
              entries:
              - type: 1
                amount: 10416.67
                vat: 2083.33
                vat_rate: 20
                user: 3896
      responses:
        '200':
          description: Contrat créé
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WriteResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/contracts/{contract_id}:
    get:
      tags: [Contracts]
      operationId: getContract
      summary: Get a contract
      description: |
        Retourne un contrat. Contrat introuvable : HTTP 200 avec le corps `null`.

        **Scope** : `contracts`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/ContractId'}
      - name: with
        in: query
        schema:
          type: string
          enum: [logs]
        description: '`logs` : historique des modifications'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Contract'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

    put:
      tags: [Contracts]
      operationId: updateContract
      summary: Update a contract
      description: |
        Met à jour un contrat de l'agence.

        **Scope** : `contracts_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/ContractId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContractInput'}
            example: {step: 4, contract_at: '2024-09-20'}
      responses:
        '200':
          description: Contrat mis à jour
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WriteResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ─────────────────────────────────────────
  # RESIDENCES
  # ─────────────────────────────────────────
  /agencies/{agency_id}/residences:
    get:
      tags: [Residences]
      operationId: listResidences
      summary: List the residences
      description: |
        Liste les résidences et immeubles de l'agence. Liste paginée, triée par date de mise à jour croissante. Pour une synchronisation incrémentale, repassez dans `timestamp` la valeur `timestamp` reçue lors de l'appel précédent.

        **Scope** : `residences`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - {$ref: '#/components/parameters/Timestamp'}
      - name: public
        in: query
        schema:
          type: integer
          enum: [0, 1]
          default: 0
        description: '`1` : ajoute les résidences partagées du pays de l''agence'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Nombre total d'éléments (avant pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: Timestamp UNIX de la mise à jour la plus récente de la page (à repasser en paramètre `timestamp` pour la synchro incrémentale)
                  residences:
                    type: array
                    description: Résidences
                    items: {$ref: '#/components/schemas/Residence'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: 'Identifiant : provider ID, mot de passe : token'
  parameters:
    AgencyId:
      name: agency_id
      in: path
      required: true
      schema: {type: string}
      example: '101'
      description: 'Identifiant de l''agence. Pour une connexion limitée à un secteur : `{agency_id}-{sector_id}`'

    PropertyId:
      name: property_id
      in: path
      required: true
      schema: {type: integer}
      description: Identifiant Apimo du bien

    ContactId:
      name: contact_id
      in: path
      required: true
      schema: {type: integer}
      description: Identifiant du contact

    LeadId:
      name: lead_id
      in: path
      required: true
      schema: {type: integer}
      description: Identifiant du lead

    RequestId:
      name: request_id
      in: path
      required: true
      schema: {type: integer}
      description: Identifiant de la demande

    UserId:
      name: user_id
      in: path
      required: true
      schema: {type: integer}
      description: Identifiant de l'utilisateur

    ContractId:
      name: contract_id
      in: path
      required: true
      schema: {type: integer}
      description: Identifiant du contrat

    ActionId:
      name: action_id
      in: path
      required: true
      schema: {type: integer}
      description: Identifiant de l'action

    Year:
      name: year
      in: path
      required: true
      schema: {type: integer, example: 2025}
      description: Année (filtre sur la date de l'action)

    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 10000
        minimum: 1
        maximum: 10000
      description: Nombre d'éléments à retourner (max 10000)

    Offset:
      name: offset
      in: query
      schema: {type: integer, default: 0, minimum: 0}
      description: Nombre d'éléments à ignorer

    Timestamp:
      name: timestamp
      in: query
      schema: {type: integer, example: 1712000000}
      description: Ne retourne que les éléments mis à jour depuis ce timestamp UNIX

    Culture:
      name: culture
      in: query
      schema: {type: string, default: en_GB, example: fr_FR}
      description: 'Langue des libellés : code complet (`fr_FR`) ou court (`fr`)'
  responses:
    BadRequest:
      description: 400 - Requête invalide (JSON invalide, token absent...)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {status: 400, title: Bad Request, detail: The JSON is invalid.}

    Unauthorized:
      description: 401 - Identifiants invalides (provider ID / token, ou IP non autorisée)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {status: 401, title: Unauthorized, detail: Please check your token}

    Forbidden:
      description: '403 - Accès refusé : pas de connexion active avec cette agence, scope manquant, ou ressource introuvable dans l''agence'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            status: 403
            title: Forbidden
            detail: The request was a valid request, but the server is refusing to respond to it.

    NotFound:
      description: 404 - Route ou catalogue inconnu
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            status: 404
            title: Not Found
            detail: The requested resource could not be found.

    UnprocessableEntity:
      description: 422 - Valeur invalide dans le corps de la requête
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {status: 422, title: Unprocessable Entity, detail: The value of type is invalid.}

    TooManyRequests:
      description: 429 - Quota journalier dépassé
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            status: 429
            title: Too Many Requests
            detail: Please limit your daily request to the server

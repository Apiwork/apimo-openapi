openapi: 3.0.3
info:
  title: Apimo API v3
  description: |
    Apimo API v3 documentation for partners (portals, CRMs, websites, business tools).

    ## Authentication
    HTTP Basic over **HTTPS only**: username = your **provider ID**, password = your **token**.
    An IP allow-list can be enabled on your partner account.

    ## Access to agencies
    You can only access agencies that enabled a connection with your partner account.
    A connection can target an agency, a company, a network or an account: `GET /provider/feeds` lists your connections
    and `GET /agencies` the matching agencies. For a connection limited to a sector, use an `agency_id`
    formatted as `{agency_id}-{sector_id}`.

    ## Scopes
    Each route requires one or more scopes enabled on your account (see `GET /provider`). Without the scope, the API answers `403`.

    | Scope | Access |
    |---|---|
    | `properties` | Read properties |
    | `properties_private` | Private property fields (owner, exact address and coordinates, net seller price, private comments...), properties of every group, history (`logs`) |
    | `properties_write` | Create and update properties, pictures, medias, documents, descriptions and portals |
    | `properties_delete` | Delete pictures, medias and documents |
    | `agencies_private` | Agency parameters, disabled users, sectors, connected portals |
    | `contacts` / `contacts_write` | Read / write contacts |
    | `requests` / `requests_write` | Read / write search requests |
    | `leads` / `leads_write` | Read / write leads |
    | `actions` / `actions_write` | Read / write actions (calendar, history) |
    | `contracts` / `contracts_write` | Read / write contracts |
    | `residences` | Read residences |
    | `catalogs_private`, `catalogs_general` | Additional catalogs |

    Routes and fields marked 🔒 **Private** are only reachable or filled with a private scope (`properties_private`, `agencies_private`).

    ## Quota
    Each call uses one request of your account's daily quota (1,000 by default), reset every night.
    Beyond it, the API answers `429`. Lead creation (`POST /agencies/{agency_id}/leads`) and `PUT /agencies/{agency_id}/properties/{property_id}/provider`
    are not counted.

    ## Pagination and incremental sync
    Lists return `total_items` (total before pagination) and, for most of them, `timestamp` (UNIX timestamp of the most recent update in the page).
    Paginate with `limit` and `offset`. Lists are sorted by ascending update date: to fetch changes only,
    call the list again with the `timestamp` parameter set to the value received during the previous sync.

    ## Formats
    - UTF-8 JSON in requests (`Content-Type: application/json`) and responses.
    - Dates: `YYYY-MM-DD`; date-times: `YYYY-MM-DD HH:MM:SS` (Paris time).
    - Value ids (types, statuses, categories...) are defined by catalogs: `GET /catalogs/{catalog}`.
    - Types: in responses, many ids and catalog values are strings (`"101"`), and so are decimal amounts (`"250000.00"`); the type of each field is given in the schemas. In requests, send numbers.
    - Multiple values are written `step[]=1&step[]=2` (`step=1` for a single value).

    ## Reading and writing
    The body to send with `POST`/`PUT` does not always follow the same schema as the `GET` response of the same resource:
    some fields are renamed or shaped differently (for example `user` is sent as an id and returned as an object,
    a contact's `company` field is returned as `name`), and some fields are read-only or write-only.
    Each write route therefore describes its own input schema (`PropertyInput`, `ContactInput`, `RequestInput`, `LeadInput`...):
    rely on it rather than on the `GET` response. We are working on aligning these formats in future versions of the API.

    ## Errors
    Errors look like `{"status": 403, "title": "Forbidden", "detail": "..."}`.
    Warning: a few routes return this body with an HTTP `200` code (resource not found on a detail route); check for `status`/`detail`.
  version: 3.0.0
  contact: {name: Apimo, url: 'https://apimo.com'}
servers:
- url: https://api.apimo.pro
  description: Production server
- url: https://virtserver.swaggerhub.com/apimo-8ef/Api3/1.0.0
  description: SwaggerHub API Auto Mocking
security:
- basicAuth: []
tags:
- name: Provider
  description: Your partner account and connections
- name: Catalogs
  description: Reference values (property types, statuses, categories...)
- name: Agencies
  description: Agencies, sectors and connected portals
- name: Users
  description: Agency users (agents)
- name: Properties
  description: Real estate properties
- name: Property Media
  description: Pictures, medias, documents and descriptions of a property
- name: Property Provider
  description: Publication of a property on partner portals
- name: Contacts
  description: Agency contacts (owners, buyers, tenants...)
- name: Requests
  description: Contact search requests and matchings
- name: Leads
  description: Incoming leads (portals, forms)
- name: Actions
  description: Actions (appointments, calls, e-mails, visits...)
- name: Contracts
  description: Contracts (sales, rentals) and entries
- name: Residences
  description: Residences and buildings

paths:

  # ─────────────────────────────────────────
  # PROVIDER
  # ─────────────────────────────────────────
  /provider:
    get:
      tags: [Provider]
      operationId: getProvider
      summary: Get your partner account
      description: |
        Returns your partner account and its enabled scopes.

        **Scope**: none.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Provider'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /provider/feeds:
    get:
      tags: [Provider]
      operationId: listProviderFeeds
      summary: List your active connections
      description: |
        Lists the active connections of your account (connected agency, company, network or account), with the date of the last lead you sent. Here `timestamp` is the time of the call.

        **Scope**: none.
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Total number of items (before pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: UNIX timestamp of the most recent update in the page (pass it back as `timestamp` for incremental sync)
                  feeds:
                    type: array
                    description: Connections
                    items: {$ref: '#/components/schemas/Feed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ─────────────────────────────────────────
  # CATALOGS
  # ─────────────────────────────────────────
  /catalogs:
    get:
      tags: [Catalogs]
      operationId: listCatalogs
      summary: List the catalogs
      description: |
        Lists the available catalogs. Private catalogs only appear with the `catalogs_private` / `catalogs_general` scopes.

        **Scope**: none.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CatalogList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /catalogs/{catalog_id}:
    get:
      tags: [Catalogs]
      operationId: getCatalog
      summary: Get the values of a catalog
      description: |
        Returns the values of a catalog in the requested language (`culture=all`: every language).

        **Scope**: none.
      parameters:
      - name: catalog_id
        in: path
        required: true
        schema: {type: string, example: property_type}
        description: Catalog name (see `GET /catalogs`)
      - {$ref: '#/components/parameters/Culture'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CatalogEntry'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ─────────────────────────────────────────
  # AGENCIES
  # ─────────────────────────────────────────
  /agencies:
    get:
      tags: [Agencies]
      operationId: listAgencies
      summary: List your agencies
      description: |
        Lists the agencies reachable through your connections, with their active users, sectors, partners and fee schedules.

        **Scope**: none.
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - {$ref: '#/components/parameters/Timestamp'}
      - name: active
        in: query
        schema: {type: boolean, default: true}
        description: '`false`: disabled agencies only'
      - name: accountId
        in: query
        schema: {type: integer}
        description: Filter on an account
      - name: with[]
        in: query
        schema:
          type: array
          items:
            type: string
            enum: [providers, parameters, backup]
        description: 'Extra data: `providers` (connected partners), `parameters` (🔒 private, `agencies_private`: agency settings), `backup` (includes disabled users)'
        style: form
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Total number of items (before pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: UNIX timestamp of the most recent update in the page (pass it back as `timestamp` for incremental sync)
                  agencies:
                    type: array
                    description: Agencies
                    items: {$ref: '#/components/schemas/Agency'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}:
    get:
      tags: [Agencies]
      operationId: getAgency
      summary: Get an agency
      description: |
        Returns one agency (same content as an item of `GET /agencies`).

        **Scope**: none.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - name: with[]
        in: query
        schema:
          type: array
          items:
            type: string
            enum: [providers, parameters, backup]
        description: 'Extra data: `providers` (connected partners), `parameters` (🔒 private, `agencies_private`: agency settings), `backup` (includes disabled users)'
        style: form
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Agency'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/sectors:
    get:
      tags: [Agencies]
      operationId: listAgencySectors
      summary: 🔒 List the agency's sectors
      description: |
        🔒 **Private route**

        Lists the geographic sectors of the agency's company.

        **Scope**: `agencies_private`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Total number of items (before pagination)
                  sectors:
                    type: array
                    description: Sectors
                    items: {$ref: '#/components/schemas/Sector'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/providers:
    get:
      tags: [Agencies]
      operationId: listAgencyProviders
      summary: 🔒 List the partners connected to the agency
      description: |
        🔒 **Private route**

        Lists the partners (portals, tools) with an active connection to the agency, its company or its network.

        **Scope**: `agencies_private`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items: {$ref: '#/components/schemas/AgencyProvider'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ─────────────────────────────────────────
  # USERS
  # ─────────────────────────────────────────
  /agencies/{agency_id}/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List the users
      description: |
        Lists the agency users (active and disabled).

        **Scope**: none.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - {$ref: '#/components/parameters/Timestamp'}
      - name: with
        in: query
        schema:
          type: string
          enum: [backup]
        description: '`backup`: full details of disabled users'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Total number of items (before pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: UNIX timestamp of the most recent update in the page (pass it back as `timestamp` for incremental sync)
                  users:
                    type: array
                    description: Users
                    items: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/users/{user_id}:
    get:
      tags: [Users]
      operationId: getUser
      summary: Get a user
      description: |
        Returns an agency user.

        **Scope**: none.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/UserId'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/users/{user_id}/actions:
    get:
      tags: [Users]
      operationId: listUserActions
      summary: List a user's actions
      description: |
        Lists the actions (appointments, calls, e-mails, visits...) of a user. Paginated list, sorted by ascending update date. For an incremental sync, pass the `timestamp` value received during the previous call as the `timestamp` parameter.

        **Scope**: `actions`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/UserId'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - {$ref: '#/components/parameters/Timestamp'}
      - name: type[]
        in: query
        schema:
          type: array
          items: {type: integer}
        description: Action types
        style: form
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Total number of items (before pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: UNIX timestamp of the most recent update in the page (pass it back as `timestamp` for incremental sync)
                  actions:
                    type: array
                    description: Actions
                    items: {$ref: '#/components/schemas/Action'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/users/{user_id}/actions/{year}:
    get:
      tags: [Users]
      operationId: listUserActionsByYear
      summary: List a user's actions for a year
      description: |
        Like `GET .../users/{user_id}/actions`, limited to the actions dated in the given year.

        **Scope**: `actions`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/UserId'}
      - {$ref: '#/components/parameters/Year'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - {$ref: '#/components/parameters/Timestamp'}
      - name: type[]
        in: query
        schema:
          type: array
          items: {type: integer}
        description: Action types
        style: form
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Total number of items (before pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: UNIX timestamp of the most recent update in the page (pass it back as `timestamp` for incremental sync)
                  actions:
                    type: array
                    description: Actions
                    items: {$ref: '#/components/schemas/Action'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ─────────────────────────────────────────
  # PROPERTIES
  # ─────────────────────────────────────────
  /agencies/{agency_id}/properties:
    get:
      tags: [Properties]
      operationId: listProperties
      summary: List the properties
      description: |
        Lists the agency properties published for you. By default: step 1 (active) and groups 1 and 3. With the `properties_private` scope, every property of the agency and their private fields, or only one portal's selection with `provider`.

        Several agencies in one call: `agency_id` = `101_102_103`.

        Paginated list, sorted by ascending update date. For an incremental sync, pass the `timestamp` value received during the previous call as the `timestamp` parameter.

        **Scope**: `properties`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - name: limit
        in: query
        schema:
          type: integer
          default: 1000
          minimum: 1
          maximum: 1000
        description: Number of properties (max 1000)
      - {$ref: '#/components/parameters/Offset'}
      - {$ref: '#/components/parameters/Timestamp'}
      - name: step[]
        in: query
        schema:
          type: array
          items: {type: integer}
        description: 'Steps (default: 1 if neither `step` nor `status`)'
        style: form
        explode: true
      - name: status[]
        in: query
        schema:
          type: array
          items: {type: integer}
        description: Statuses
        style: form
        explode: true
      - name: group[]
        in: query
        schema:
          type: array
          items: {type: integer}
        description: '🔒 **Private** — Groups (without `properties_private`: 1 and 3)'
        style: form
        explode: true
      - name: user_id[]
        in: query
        schema:
          type: array
          items: {type: integer}
        description: Agents
        style: form
        explode: true
      - name: provider
        in: query
        schema: {type: integer}
        description: '🔒 **Private** — Id of a portal connected to the agency: returns only the properties selected for that portal. `403` if the agency has no active connection with that portal. Without the `properties_private` scope, this parameter is ignored: you get your own selection'
      - name: updated
        in: query
        schema: {type: string, example: '2024-06-01 00:00:00'}
        description: Properties updated since this date
      - name: sold_at
        in: query
        schema: {type: string, format: date}
        description: Properties sold since this date
      - name: culture
        in: query
        schema: {type: string, example: fr_FR}
        description: Language of city/region names and diagnostic labels
      - name: currency
        in: query
        schema: {type: string, example: USD}
        description: Converts `price.value` to this currency (the original price is returned in `price.original_value`)
      - name: with[]
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - advanced
            - advanced_services
            - advanced_proximities
            - options
            - partners
            - graph_infos
            - graph_i18n
            - logs
            - backup
        description: 'Extra data (e.g. `with[]=options&with[]=logs`): `advanced` (detailed services and proximities), `advanced_services`, `advanced_proximities`, `options` (publication options per portal), `partners` (publication portals), `graph_infos` (energy label images), `graph_i18n` (with `graph_infos`: image per language), `logs` (🔒 private: change history), `backup` (🔒 private: the whole property, including unpublished pictures, documents and medias)'
        style: form
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Total number of properties
                  timestamp:
                    type: integer
                    nullable: true
                    description: UNIX timestamp of the most recent update in the page
                  processing_time:
                    type: number
                    description: Processing time in seconds
                  properties:
                    type: array
                    items: {$ref: '#/components/schemas/Property'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

    post:
      tags: [Properties]
      operationId: createProperty
      summary: Create or update a property
      description: |
        Creates a property. If `id` is given, or if a property of the agency already has the `reference` sent, that property is updated (upsert).

        Business errors: missing `user` on creation (422), unknown `user`/`owner`/`tenant`/`parent` (400/403), value out of range for `step`, `status`, `category`, `type` (422), neither `reference` nor `id` (403). A save failure is returned with HTTP 200 as `{"error": "..."}`.

        **Scope**: `properties_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - {$ref: '#/components/schemas/PropertyInput'}
              required: [reference, user]
            example:
              reference: REF-2024-001
              user: 3896
              category: 1
              type: 1
              subtype: 5
              city: Nice
              zipcode: '06000'
              address: 12 rue Gambetta
              area: {unit: 1, value: 65.5}
              rooms: 3
              bedrooms: 2
              price: {value: 350000, currency: EUR, hide: false}
              regulations:
              - {type: 1, value: '152'}
              - {type: 2, value: '18'}
      responses:
        '200':
          description: Property created or updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WriteResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/properties/logs:
    get:
      tags: [Properties]
      operationId: listPropertyLogs
      summary: 🔒 List the property change history
      description: |
        🔒 **Private route**

        Change history of the agency properties.

        **Scope**: `properties_private`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - {$ref: '#/components/parameters/Timestamp'}
      - name: property_id
        in: query
        schema: {type: integer}
        description: Filter on a property
      - name: order
        in: query
        schema:
          type: string
          enum: [asc, desc]
          default: asc
        description: Chronological order
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Total number of items (before pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: UNIX timestamp of the most recent update in the page (pass it back as `timestamp` for incremental sync)
                  logs:
                    type: array
                    description: Changes
                    items: {$ref: '#/components/schemas/PropertyLog'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/properties/{property_id}:
    get:
      tags: [Properties]
      operationId: getProperty
      summary: Get a property
      description: |
        Returns one property (same parameters and content as the list). The same default filters apply: for a property that is not at step 1, pass `step`. Property not found: HTTP 200 with `{"status": 403, "title": "Forbidden", "detail": "Property not found."}`.

        **Scope**: `properties`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/PropertyId'}
      - name: step[]
        in: query
        schema:
          type: array
          items: {type: integer}
        description: 'Accepted steps (default: 1)'
        style: form
        explode: true
      - name: culture
        in: query
        schema: {type: string, example: fr_FR}
        description: Language of city/region names and diagnostic labels
      - name: currency
        in: query
        schema: {type: string, example: USD}
        description: Converts `price.value` to this currency (the original price is returned in `price.original_value`)
      - name: with[]
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - advanced
            - advanced_services
            - advanced_proximities
            - options
            - partners
            - graph_infos
            - graph_i18n
            - logs
            - backup
        description: 'Extra data (e.g. `with[]=options&with[]=logs`): `advanced` (detailed services and proximities), `advanced_services`, `advanced_proximities`, `options` (publication options per portal), `partners` (publication portals), `graph_infos` (energy label images), `graph_i18n` (with `graph_infos`: image per language), `logs` (🔒 private: change history), `backup` (🔒 private: the whole property, including unpublished pictures, documents and medias)'
        style: form
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Property'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

    put:
      tags: [Properties]
      operationId: updateProperty
      summary: Update a property
      description: |
        Updates a property. Only the fields sent are changed.

        **Scope**: `properties_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/PropertyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PropertyInput'}
            example:
              price: {value: 340000}
              status: 22
      responses:
        '200':
          description: Property updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WriteResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/properties/{property_id}/crossings:
    get:
      tags: [Properties]
      operationId: listPropertyCrossings
      summary: List the requests matching a property
      description: |
        Lists the search requests matched with this property (requests of the agency, its company or its network). Paginated list, sorted by ascending update date. For an incremental sync, pass the `timestamp` value received during the previous call as the `timestamp` parameter.

        **Scope**: `properties`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/PropertyId'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - {$ref: '#/components/parameters/Timestamp'}
      - name: step[]
        in: query
        schema:
          type: array
          items: {type: integer}
        description: Matching steps
        style: form
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Total number of items (before pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: UNIX timestamp of the most recent update in the page (pass it back as `timestamp` for incremental sync)
                  crossings:
                    type: array
                    description: Matchings
                    items: {$ref: '#/components/schemas/PropertyCrossing'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ─────────────────────────────────────────
  # PROPERTY MEDIA
  # ─────────────────────────────────────────
  /agencies/{agency_id}/properties/{property_id}/pictures:
    post:
      tags: [Property Media]
      operationId: addPropertyPicture
      summary: Add a picture
      description: |
        Adds a picture at the end of the property. If `reference` is given, the other pictures of the property with the same reference are deleted (replacement). Formats: JPEG, PNG, GIF, WEBP, BMP; the picture is resized to 1920 px on its longest side.

        **Scope**: `properties_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/PropertyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: Base64-encoded image (without `data:` prefix)
                reference:
                  type: string
                  description: Your unique picture reference
                  example: 69f36ec470396
                comments:
                  type: array
                  description: Captions per language (200 characters max)
                  items: {$ref: '#/components/schemas/I18nComment'}
      responses:
        '200':
          description: Picture added
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Picture id
                    example: 66321497
                  rank:
                    type: integer
                    description: Rank
                    example: 12
                  url:
                    type: string
                    description: Picture URL
                  width_max:
                    type: integer
                    description: Width
                    example: 1920
                  height_max:
                    type: integer
                    description: Height
                    example: 1280
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/properties/{property_id}/pictures/{picture_id}:
    delete:
      tags: [Property Media]
      operationId: deletePropertyPicture
      summary: Delete a picture
      description: |
        Deletes a picture of the property.

        **Scope**: `properties_delete`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/PropertyId'}
      - name: picture_id
        in: path
        required: true
        schema: {type: integer}
        description: Apimo picture id (not your reference)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: '`true` when deleted'
                    example: true
                  error:
                    type: string
                    description: Reason when not deleted (e.g. item not found, returned with HTTP 200)
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/properties/{property_id}/medias:
    post:
      tags: [Property Media]
      operationId: upsertPropertyMedia
      summary: Add or update a media
      description: |
        Adds a video or a virtual tour. If a media of the property already has this `reference`, it is updated.

        **Scope**: `properties_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/PropertyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference, type, content]
              properties:
                reference:
                  type: string
                  description: Your unique media reference
                  example: video-1
                type:
                  type: integer
                  description: 'Media type : 1 Dailymotion, 2 YouTube, 3 Previsite, 5 Giroptic, 6 VisiteOnline, 7 HDMedia, 8 SmartVisite, 9 HTML, 10 Meilleure Visite, 11 NodalView, 12 Matterport, 13 Immoviewer, 14 Spectando, 15 Vimeo, 16 We Visite, 17 Visitou, 18 enVisite, 19 Clap.video, 20 Ogulo, 21 Rhinov, 22 Klapty, 23 Realisti, 24 Floorplanner, 25 Giraffe 360, 26 EyeSpy360, 27 RICOH360 Tours, 28 Spec.co, 29 DoorInsider, 30 6EmeVue, 31 iFrame, 32 Facebook, 33 Kuula, 35 Poly.cam'
                  example: 2
                content:
                  type: string
                  description: Media link or HTML code (iframe)
                  example: https://youtu.be/JGowo0ARgPo
      responses:
        '200':
          description: Media saved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/properties/{property_id}/medias/{media_id}:
    delete:
      tags: [Property Media]
      operationId: deletePropertyMedia
      summary: Delete a media
      description: |
        Deletes a media of the property.

        **Scope**: `properties_delete`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/PropertyId'}
      - name: media_id
        in: path
        required: true
        schema: {type: integer}
        description: Apimo media id (not your reference)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: '`true` when deleted'
                    example: true
                  error:
                    type: string
                    description: Reason when not deleted (e.g. item not found, returned with HTTP 200)
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/properties/{property_id}/documents:
    post:
      tags: [Property Media]
      operationId: addPropertyDocument
      summary: Add a document
      description: |
        Adds a private document to the property (not published online nor on the extranet). Formats: pdf, doc, docx, xls, xlsx, csv, txt, html, jpg, png, gif, webp.

        **Scope**: `properties_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/PropertyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, content]
              properties:
                name:
                  type: string
                  description: File name, with extension
                  example: diagnostics.pdf
                content:
                  type: string
                  description: Base64-encoded file
                type_id:
                  type: integer
                  description: Document type → catalog `document_type`
      responses:
        '200':
          description: Document added
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Document id
                    example: 5480610
                  owner:
                    type: integer
                    description: Property id
                  name:
                    type: string
                    description: File name
                  url:
                    type: string
                    description: Document URL
                  download_url:
                    type: string
                    description: Download URL
                  filesize:
                    type: string
                    description: Size in KB
                    example: '123.45'
                  type_id:
                    type: integer
                    nullable: true
                    description: Document type
                  internet:
                    type: boolean
                    description: Always `false`
                  extranet:
                    type: boolean
                    description: Always `false`
                  private:
                    type: boolean
                    description: Always `true`
                  created_at:
                    type: string
                    description: Creation date
                    example: '2024-06-15 14:30:00'
                  updated_at:
                    type: string
                    description: Update date
                    example: '2024-06-15 14:30:00'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/properties/{property_id}/documents/{document_id}:
    delete:
      tags: [Property Media]
      operationId: deletePropertyDocument
      summary: Delete a document
      description: |
        Deletes a document of the property.

        **Scope**: `properties_delete`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/PropertyId'}
      - name: document_id
        in: path
        required: true
        schema: {type: integer}
        description: Apimo document id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: '`true` when deleted'
                    example: true
                  error:
                    type: string
                    description: Reason when not deleted (e.g. item not found, returned with HTTP 200)
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/properties/{property_id}/comments:
    post:
      tags: [Property Media]
      operationId: upsertPropertyComments
      summary: Add or update descriptions
      description: |
        Creates or updates the property description in one language (one object) or several (array of objects). Only the fields sent are changed; if every field of a language is empty, the description in that language is deleted. Plain text (HTML is not supported).

        **Scope**: `properties_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/PropertyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - {$ref: '#/components/schemas/PropertyCommentInput'}
              - type: array
                items: {$ref: '#/components/schemas/PropertyCommentInput'}
            example:
            - {language: fr, title: Bel appartement, comment: Au cœur de Nice...}
            - {language: en, title: Nice flat, comment: In the heart of Nice...}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Property id
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ─────────────────────────────────────────
  # PROPERTY PROVIDER
  # ─────────────────────────────────────────
  /agencies/{agency_id}/properties/{property_id}/providers:
    get:
      tags: [Property Provider]
      operationId: listPropertyProviders
      summary: List the portals of a property
      description: |
        Lists the portals the property is published on or proposed to.

        **Scope**: `properties`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/PropertyId'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        provider:
                          type: string
                          description: Portal id
                          example: '100'
                        step:
                          type: string
                          enum: ['1', '2', '3', '4']
                          description: 1 published, 2 pending request, 3 refused, 4 unpublished
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

    post:
      tags: [Property Provider]
      operationId: setPropertyProvider
      summary: Publish or unpublish a property on a portal
      description: |
        Publishes (`step` 1, default) or unpublishes (`step` 2, 3 or 4) the property on a portal the agency subscribes to.

        **Scope**: `properties_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/PropertyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider:
                  type: integer
                  description: Portal id
                  example: 100
                step:
                  type: integer
                  enum: [1, 2, 3, 4]
                  description: 1 = publish, 2/3/4 = unpublish
                  default: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Property id
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/properties/{property_id}/provider:
    put:
      tags: [Property Provider]
      operationId: updatePropertyPublication
      summary: Send back the listing URL and publication date
      description: |
        For a portal: sends back to Apimo the listing URL and/or its publication date on your website (at least one of them). The property must be published to you. Not counted in the quota.

        **Scope**: `properties`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/PropertyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: Listing URL on your website
                  example: https://www.monportail.fr/annonce/12345
                date:
                  type: string
                  description: Publication date (`YYYY-MM-DD HH:MM:SS` or UNIX timestamp)
                  example: '2024-06-15 14:30:00'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Publication id (not the property id)
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /agencies/{agency_id}/properties/{property_id}/error:
    post:
      tags: [Property Provider]
      operationId: reportPropertyError
      summary: Report a publication error
      description: |
        Reports to the agency an error while publishing the property on your portal (message shown in Apimo). Send `{}` or an empty message to clear the error. The property must be published to you.

        **Scope**: `properties`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/PropertyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  nullable: true
                  description: Error message (200 characters max); empty to clear
                  example: Missing energy label
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Property id
                  message:
                    type: string
                    nullable: true
                    description: Saved message
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ─────────────────────────────────────────
  # CONTACTS
  # ─────────────────────────────────────────
  /agencies/{agency_id}/contacts:
    get:
      tags: [Contacts]
      operationId: listContacts
      summary: List the contacts
      description: |
        Lists the agency contacts. Paginated list, sorted by ascending update date. For an incremental sync, pass the `timestamp` value received during the previous call as the `timestamp` parameter.

        **Scope**: `contacts`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - {$ref: '#/components/parameters/Timestamp'}
      - name: with
        in: query
        schema:
          type: string
          enum: [extranet_logs]
        description: '`extranet_logs`: property views on the extranet'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Total number of items (before pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: UNIX timestamp of the most recent update in the page (pass it back as `timestamp` for incremental sync)
                  contacts:
                    type: array
                    description: Contacts
                    items: {$ref: '#/components/schemas/Contact'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

    post:
      tags: [Contacts]
      operationId: createContact
      summary: Create a contact
      description: |
        Creates a contact (no deduplication: each call creates a new contact).

        **Scope**: `contacts_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - {$ref: '#/components/schemas/ContactInput'}
              required: [user]
            example:
              user: 3896
              category: 1
              title: 1
              firstname: Jean
              lastname: Dupont
              email: jean.dupont@example.com
              mobile: '+33611111111'
              city: Nice
              zipcode: '06000'
              language: [fr]
      responses:
        '200':
          description: Contact created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WriteResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/contacts/{contact_id}:
    get:
      tags: [Contacts]
      operationId: getContact
      summary: Get a contact
      description: |
        Returns a contact. Contact not found: HTTP 200 with a `null` body.

        **Scope**: `contacts`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/ContactId'}
      - name: with
        in: query
        schema:
          type: string
          enum: [extranet_logs]
        description: '`extranet_logs`: property views on the extranet'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Contact'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

    put:
      tags: [Contacts]
      operationId: updateContact
      summary: Update a contact
      description: |
        Updates a contact of the agency.

        **Scope**: `contacts_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/ContactId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContactInput'}
            example:
              mobile: '+33622222222'
              language: [fr]
      responses:
        '200':
          description: Contact updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WriteResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/contacts/{contact_id}/actions:
    get:
      tags: [Contacts]
      operationId: listContactActions
      summary: List a contact's actions
      description: |
        Lists the actions linked to a contact, whatever the user. Paginated list, sorted by ascending update date. For an incremental sync, pass the `timestamp` value received during the previous call as the `timestamp` parameter.

        **Scope**: `actions`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/ContactId'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - {$ref: '#/components/parameters/Timestamp'}
      - name: type[]
        in: query
        schema:
          type: array
          items: {type: integer}
        description: Action types
        style: form
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Total number of items (before pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: UNIX timestamp of the most recent update in the page (pass it back as `timestamp` for incremental sync)
                  actions:
                    type: array
                    description: Actions
                    items: {$ref: '#/components/schemas/Action'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/contacts/{contact_id}/actions/{year}:
    get:
      tags: [Contacts]
      operationId: listContactActionsByYear
      summary: List a contact's actions for a year
      description: |
        Like `GET .../contacts/{contact_id}/actions`, limited to the actions dated in the given year.

        **Scope**: `actions`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/ContactId'}
      - {$ref: '#/components/parameters/Year'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - {$ref: '#/components/parameters/Timestamp'}
      - name: type[]
        in: query
        schema:
          type: array
          items: {type: integer}
        description: Action types
        style: form
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Total number of items (before pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: UNIX timestamp of the most recent update in the page (pass it back as `timestamp` for incremental sync)
                  actions:
                    type: array
                    description: Actions
                    items: {$ref: '#/components/schemas/Action'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ─────────────────────────────────────────
  # REQUESTS
  # ─────────────────────────────────────────
  /agencies/{agency_id}/requests:
    get:
      tags: [Requests]
      operationId: listRequests
      summary: List the search requests
      description: |
        Lists the agency search requests (active and inactive). Paginated list, sorted by ascending update date. For an incremental sync, pass the `timestamp` value received during the previous call as the `timestamp` parameter.

        **Scope**: `requests`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - {$ref: '#/components/parameters/Timestamp'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Total number of items (before pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: UNIX timestamp of the most recent update in the page (pass it back as `timestamp` for incremental sync)
                  requests:
                    type: array
                    description: Requests
                    items: {$ref: '#/components/schemas/Request'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

    post:
      tags: [Requests]
      operationId: createRequest
      summary: Create a search request
      description: |
        Creates a search request for an agency contact. If `id` is given, updates that request.

        **Scope**: `requests_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - {$ref: '#/components/schemas/RequestInput'}
              required: [contact, user]
            example:
              contact: 220351
              user: 3896
              category: 1
              types: [1, 2]
              country: FR
              locations:
              - Nice
              - {city: Antibes}
              rooms_operator: 2
              rooms: 3
              price: {max: 400000, currency: EUR}
      responses:
        '200':
          description: Request created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WriteResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/requests/{request_id}:
    get:
      tags: [Requests]
      operationId: getRequest
      summary: Get a search request
      description: |
        Returns one request, in the same envelope as the list (`requests` holds one item; empty when not found).

        **Scope**: `requests`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/RequestId'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Total number of items (before pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: UNIX timestamp of the most recent update in the page (pass it back as `timestamp` for incremental sync)
                  requests:
                    type: array
                    description: Requests
                    items: {$ref: '#/components/schemas/Request'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

    put:
      tags: [Requests]
      operationId: updateRequest
      summary: Update a search request
      description: |
        Updates a request of the agency. Warning: without `country`, the country is reset to the agency's.

        **Scope**: `requests_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/RequestId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RequestInput'}
            example: {active: false}
      responses:
        '200':
          description: Request updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WriteResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/requests/{request_id}/crossings:
    get:
      tags: [Requests]
      operationId: listRequestCrossings
      summary: List the properties matching a request
      description: |
        Lists the properties matched with this request (properties of the agency, its company or its network). Paginated list, sorted by ascending update date. For an incremental sync, pass the `timestamp` value received during the previous call as the `timestamp` parameter.

        **Scope**: `requests`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/RequestId'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - {$ref: '#/components/parameters/Timestamp'}
      - name: step[]
        in: query
        schema:
          type: array
          items: {type: integer}
        description: Matching steps
        style: form
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Total number of items (before pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: UNIX timestamp of the most recent update in the page (pass it back as `timestamp` for incremental sync)
                  crossings:
                    type: array
                    description: Matchings
                    items: {$ref: '#/components/schemas/RequestCrossing'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ─────────────────────────────────────────
  # LEADS
  # ─────────────────────────────────────────
  /agencies/{agency_id}/leads:
    get:
      tags: [Leads]
      operationId: listLeads
      summary: List the leads
      description: |
        Lists every lead of the agency, whatever their source. Paginated list, sorted by ascending update date. For an incremental sync, pass the `timestamp` value received during the previous call as the `timestamp` parameter.

        **Scope**: `leads`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - {$ref: '#/components/parameters/Timestamp'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Total number of items (before pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: UNIX timestamp of the most recent update in the page (pass it back as `timestamp` for incremental sync)
                  leads:
                    type: array
                    description: Leads
                    items: {$ref: '#/components/schemas/Lead'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

    post:
      tags: [Leads]
      operationId: createLead
      summary: Send a lead
      description: |
        Sends a lead to the agency (not counted in the quota). An alert e-mail is sent to the agency for a new lead of type 1, 2, 3 or 6, unless `no_alert` is set. If you already sent this `reference` for the agency, the existing lead is updated (and replaced, see `LeadInput`). Sending is open without a connection to the agency; updating a lead by its `id` needs an active connection.

        **Scope**: `leads_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - {$ref: '#/components/schemas/LeadInput'}
              required: [reference]
            example:
              reference: 194D1DDEDdE
              type: 1
              firstname: Jean
              lastname: Dupont
              email: user@example.com
              phone: '+33611111111'
              language: fr
              message: Bonjour, ce bien est-il toujours disponible ?
              property_reference: '24367'
              date: '2024-06-15 14:30:00'
      responses:
        '200':
          description: Lead created or updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WriteResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}

  /agencies/{agency_id}/leads/{lead_id}:
    get:
      tags: [Leads]
      operationId: getLead
      summary: Get a lead
      description: |
        Returns one lead, in the same envelope as the list (`leads` holds one item; empty when not found).

        **Scope**: `leads`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/LeadId'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Total number of items (before pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: UNIX timestamp of the most recent update in the page (pass it back as `timestamp` for incremental sync)
                  leads:
                    type: array
                    description: Leads
                    items: {$ref: '#/components/schemas/Lead'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

    put:
      tags: [Leads]
      operationId: updateLead
      summary: Update a lead
      description: |
        Updates a lead of the agency (an active connection to the agency is required). **Fields not sent are emptied** (see `LeadInput`).

        **Scope**: `leads_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/LeadId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LeadInput'}
            example:
              step: 4
              firstname: Jean
              lastname: Dupont
              email: user@example.com
              date: '2024-06-15 14:30:00'
      responses:
        '200':
          description: Lead updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WriteResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}

  # ─────────────────────────────────────────
  # ACTIONS
  # ─────────────────────────────────────────
  /agencies/{agency_id}/actions:
    post:
      tags: [Actions]
      operationId: createAction
      summary: Create an action
      description: |
        Creates an action (appointment, call, e-mail, visit...) for a user, linked to a contact and/or properties. To read actions: `GET .../users/{user_id}/actions` or `GET .../contacts/{contact_id}/actions`.

        **Scope**: `actions_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - {$ref: '#/components/schemas/ActionInput'}
              required: [type, user, date]
            example:
              type: 15
              method: 6
              user: 3896
              contact: 220351
              date: '2024-06-15'
              time_start: '14:30'
              time_end: '15:30'
              subject: Visite appartement centre-ville
              properties: [181297]
      responses:
        '200':
          description: Action created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/actions/{action_id}:
    put:
      tags: [Actions]
      operationId: updateAction
      summary: Update an action
      description: |
        Updates an action of an agency user.

        **Scope**: `actions_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/ActionId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActionInput'}
            example:
              content: Le client souhaite une deuxième visite.
              properties:
              - {id: 181297, rating: 4}
      responses:
        '200':
          description: Action updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ─────────────────────────────────────────
  # CONTRACTS
  # ─────────────────────────────────────────
  /agencies/{agency_id}/contracts:
    get:
      tags: [Contracts]
      operationId: listContracts
      summary: List the contracts
      description: |
        Lists the agency contracts (sales, rentals). Paginated list, sorted by ascending update date. For an incremental sync, pass the `timestamp` value received during the previous call as the `timestamp` parameter.

        **Scope**: `contracts`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - {$ref: '#/components/parameters/Timestamp'}
      - name: with
        in: query
        schema:
          type: string
          enum: [logs]
        description: '`logs`: change history'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Total number of items (before pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: UNIX timestamp of the most recent update in the page (pass it back as `timestamp` for incremental sync)
                  contracts:
                    type: array
                    description: Contracts
                    items: {$ref: '#/components/schemas/Contract'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

    post:
      tags: [Contracts]
      operationId: createContract
      summary: Create a contract
      description: |
        Creates a contract (each call creates a new contract).

        **Scope**: `contracts_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - {$ref: '#/components/schemas/ContractInput'}
              required: [price]
            example:
              step: 2
              property: 181297
              price: 250000
              currency: EUR
              commission: 12500
              commitment_at: '2024-06-15'
              contacts:
              - {contact: 220351, type: 1}
              entries:
              - type: 1
                amount: 10416.67
                vat: 2083.33
                vat_rate: 20
                user: 3896
      responses:
        '200':
          description: Contract created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WriteResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/contracts/{contract_id}:
    get:
      tags: [Contracts]
      operationId: getContract
      summary: Get a contract
      description: |
        Returns a contract. Contract not found: HTTP 200 with a `null` body.

        **Scope**: `contracts`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/ContractId'}
      - name: with
        in: query
        schema:
          type: string
          enum: [logs]
        description: '`logs`: change history'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Contract'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

    put:
      tags: [Contracts]
      operationId: updateContract
      summary: Update a contract
      description: |
        Updates a contract of the agency.

        **Scope**: `contracts_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/ContractId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContractInput'}
            example: {step: 4, contract_at: '2024-09-20'}
      responses:
        '200':
          description: Contract updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WriteResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ─────────────────────────────────────────
  # RESIDENCES
  # ─────────────────────────────────────────
  /agencies/{agency_id}/residences:
    get:
      tags: [Residences]
      operationId: listResidences
      summary: List the residences
      description: |
        Lists the agency residences and buildings. Paginated list, sorted by ascending update date. For an incremental sync, pass the `timestamp` value received during the previous call as the `timestamp` parameter.

        **Scope**: `residences`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - {$ref: '#/components/parameters/Timestamp'}
      - name: public
        in: query
        schema:
          type: integer
          enum: [0, 1]
          default: 0
        description: '`1`: adds the shared residences of the agency''s country'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Total number of items (before pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: UNIX timestamp of the most recent update in the page (pass it back as `timestamp` for incremental sync)
                  residences:
                    type: array
                    description: Residences
                    items: {$ref: '#/components/schemas/Residence'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: 'Username: provider ID, password: token'
  parameters:
    AgencyId:
      name: agency_id
      in: path
      required: true
      schema: {type: string}
      example: '101'
      description: 'Agency id. For a connection limited to a sector: `{agency_id}-{sector_id}`'

    PropertyId:
      name: property_id
      in: path
      required: true
      schema: {type: integer}
      description: Apimo property id

    ContactId:
      name: contact_id
      in: path
      required: true
      schema: {type: integer}
      description: Contact id

    LeadId:
      name: lead_id
      in: path
      required: true
      schema: {type: integer}
      description: Lead id

    RequestId:
      name: request_id
      in: path
      required: true
      schema: {type: integer}
      description: Request id

    UserId:
      name: user_id
      in: path
      required: true
      schema: {type: integer}
      description: User id

    ContractId:
      name: contract_id
      in: path
      required: true
      schema: {type: integer}
      description: Contract id

    ActionId:
      name: action_id
      in: path
      required: true
      schema: {type: integer}
      description: Action id

    Year:
      name: year
      in: path
      required: true
      schema: {type: integer, example: 2025}
      description: Year (filters on the action date)

    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 10000
        minimum: 1
        maximum: 10000
      description: Number of items to return (max 10000)

    Offset:
      name: offset
      in: query
      schema: {type: integer, default: 0, minimum: 0}
      description: Number of items to skip

    Timestamp:
      name: timestamp
      in: query
      schema: {type: integer, example: 1712000000}
      description: Only return items updated since this UNIX timestamp

    Culture:
      name: culture
      in: query
      schema: {type: string, default: en_GB, example: fr_FR}
      description: 'Language of the labels: full (`fr_FR`) or short (`fr`) code'
  responses:
    BadRequest:
      description: 400 - Bad request (invalid JSON, missing token...)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {status: 400, title: Bad Request, detail: The JSON is invalid.}

    Unauthorized:
      description: 401 - Invalid credentials (provider ID / token, or IP not allowed)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {status: 401, title: Unauthorized, detail: Please check your token}

    Forbidden:
      description: '403 - Access denied: no active connection with this agency, missing scope, or resource not found in the agency'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            status: 403
            title: Forbidden
            detail: The request was a valid request, but the server is refusing to respond to it.

    NotFound:
      description: 404 - Unknown route or catalog
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            status: 404
            title: Not Found
            detail: The requested resource could not be found.

    UnprocessableEntity:
      description: 422 - Invalid value in the request body
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {status: 422, title: Unprocessable Entity, detail: The value of type is invalid.}

    TooManyRequests:
      description: 429 - Daily quota exceeded
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            status: 429
            title: Too Many Requests
            detail: Please limit your daily request to the server
  schemas:
    Error:
      type: object
      description: Error
      properties:
        status:
          type: integer
          description: HTTP code
          example: 403
        title:
          type: string
          description: Error label
          example: Forbidden
        detail:
          type: string
          description: Error detail
          example: You need the scope "properties_write".

    I18nComment:
      type: object
      properties:
        language:
          type: string
          description: ISO 639-1 language code
          example: fr
        comment:
          type: string
          description: Text

    Story:
      type: object
      properties:
        language:
          type: string
          description: Language code
          example: fr
        title:
          type: string
          description: Title
        content:
          type: string
          description: Content

    Partner:
      type: object
      description: Partner (insurance, guarantee, network...)
      properties:
        type:
          type: string
          description: Partner type → catalog `partner`
        partner:
          type: string
          nullable: true
          description: Partner id
        name:
          type: string
          nullable: true
          description: Partner name
        reference:
          type: string
          nullable: true
          description: Agency reference at the partner
        city:
          type: string
          description: City (only for some partner types)
        amount:
          type: string
          nullable: true
          description: Amount (decimal number as a string)
        currency:
          type: string
          nullable: true
          description: ISO 4217 currency
          example: EUR

    WriteResult:
      type: object
      description: Write result
      properties:
        id:
          type: integer
          description: Apimo id of the created or updated item
          example: 19344239
        created_at:
          type: string
          description: Creation date
          example: '2024-06-15 14:30:00'
        updated_at:
          type: string
          description: Last update date
          example: '2024-06-15 14:30:00'

    IdResult:

          type: integer
      responses:
        "200":
          description: Action created
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/contracts:
    get:
      tags:
      - Contracts
      summary: Retrieve the contracts list
      operationId: listContracts
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/residences:
    get:
      tags:
      - Residences
      summary: Retrieve the residences list
      operationId: listResidences
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/users:
    get:
      tags:
      - Users
      summary: Retrieve the users list
      operationId: listUsers
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:

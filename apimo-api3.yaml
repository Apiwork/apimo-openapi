  # ─────────────────────────────────────────
  # USERS - Historique des actions
  # ─────────────────────────────────────────
  /agencies/{agency_id}/users/{user_id}/actions:
    get:
      tags: [Users]
      operationId: getUserActions
      summary: Retrieve actions list of a specific user
      description: "Retourne l'historique des actions d'un utilisateur/négociateur spécifique."
      parameters:
        - name: agency_id
          in: path
          required: true
          schema: { type: integer }
          description: "Identifiant unique de l'agence"
        - name: user_id
          in: path
          required: true
          schema: { type: integer }
          description: "Identifiant unique de l'utilisateur/agent"
        - name: limit
          in: query
          schema: { type: integer, default: 1000, maximum: 1000 }
          description: "Nombre d'enregistrements à retourner (max: 1000)"
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
          description: "Nombre d'enregistrements à ignorer"
        - name: type
          in: query
          schema: { type: integer }
          description: "Filtrer par type d'action → voir catalog action_type"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      actions:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: "ID de l'action (retourné en string)"
                              example: "19344999"
                            type:
                              type: string
                              description: "Type d'action → voir catalog action_type"
                              example: "2"
                            user:
                              type: string
                              description: "ID de l'utilisateur (devrait être égal à {user_id})"
                              example: "1234"
                            contact:
                              type: string
                              nullable: true
                              description: "ID du contact associé"
                              example: "8520201"
                            date:
                              type: string
                              format: date
                              description: "Date de l'action"
                              example: "2018-09-11"
                            time_start:
                              type: string
                              nullable: true
                              description: "Heure de début (HH:MM:SS)"
                              example: "14:43:20"
                            time_end:
                              type: string
                              nullable: true
                              description: "Heure de fin (HH:MM:SS)"
                              example: "15:43:00"
                            subject:
                              type: string
                              nullable: true
                              description: "Sujet de l'action (peut être le sujet d'un email)"
                              example: "More details on a new property"
                            content:
                              type: string
                              nullable: true
                              description: "Contenu de l'action (peut être le corps d'un email)"
                              example: "Hello, …"
                            properties:
                              type: object
                              nullable: true
                              description: "Bien(s) associé(s) à l'action"
                              properties:
                                id:
                                  type: string
                                  example: "233030"
                                report:
                                  type: string
                                  nullable: true
                                price:
                                  type: string
                                  example: "2600000"
                                currency:
                                  type: string
                                  example: "EUR"
                                rating:
                                  type: string
                                  nullable: true
                                assessment:
                                  type: string
                                  nullable: true
                            referral:
                              type: string
                              nullable: true
                              description: "Origine de l'action"
                            subreferral:
                              type: string
                              nullable: true
                              description: "Sous-origine de l'action"
                            created_at:
                              type: string
                              format: date-time
                              example: "2018-09-11T14:43:20Z"
                            updated_at:
                              type: string
                              format: date-time
                              example: "2018-09-11T14:43:20Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ─────────────────────────────────────────
  # REQUESTS - Crossings par demande
  # ─────────────────────────────────────────
  /agencies/{agency_id}/requests/{request_id}/crossings:
    get:
      tags: [Requests]
      operationId: listRequestCrossings
      summary: Crossing list (matched properties) for a specific request
      description: |
        Retourne la liste des biens qui matchent une demande de recherche donnée.
        Symétrique de `GET /properties/{property_id}/crossings` qui retourne
        les demandes matchant un bien — ici on part d'une demande pour trouver les biens.

        **Synchronisation incrémentale :**
        Passez le champ `timestamp` retourné par la dernière réponse pour ne
        récupérer que les rapprochements mis à jour depuis cette date.
      parameters:
        - name: agency_id
          in: path
          required: true
          schema: { type: integer }
          description: "Identifiant unique de l'agence"
        - name: request_id
          in: path
          required: true
          schema: { type: integer }
          description: "Identifiant unique de la demande de recherche"
        - name: limit
          in: query
          schema: { type: integer, default: 10000, maximum: 10000 }
          description: "Nombre d'enregistrements à retourner (max: 10000)"
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
          description: "Nombre d'enregistrements à ignorer"
        - name: timestamp
          in: query
          schema: { type: integer }
          description: "Retourne les rapprochements mis à jour depuis ce timestamp UNIX"
        - name: step
          in: query
          schema: { type: integer }
          description: "Filtrer par step (1=À suggérer, 2=Déjà suggéré, 3=Non suggéré)"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      crossings:
                        type: array
                        items:
                          type: object
                          properties:
                            property_id:
                              type: integer
                              description: "ID du bien rapproché"
                              example: 1234567
                            step_id:
                              type: integer
                              description: "1=À suggérer, 2=Déjà suggéré, 3=Non suggéré"
                              enum: [1, 2, 3]
                              example: 1
                            total:
                              type: string
                              description: "Score de rapprochement de 0 à 100"
                              example: "100"
                            created_at:
                              type: string
                              format: date-time
                              example: "2010-10-08T15:12:02Z"
                            updated_at:
                              type: string
                              format: date-time
                              example: "2014-04-10T09:37:18Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
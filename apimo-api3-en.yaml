      - name: user_id
        in: query
        description: Filter actions by a specific user
        required: false
        schema:
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/requests:
    get:
      tags:
      - Requests
      summary: Retrieve the requests list
      operationId: listRequests
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
      - Requests

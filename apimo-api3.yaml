    # Note : les IDs sont retournés en string par l'API
    # ─────────────────────────────────────────
    Request:
      type: object
      description: "Demande de recherche d'un contact"
      properties:
        id:
          type: integer
          description: "Identifiant unique de la demande"
          example: 156488
        active:
          type: boolean
          description: "Si la demande est active"
          example: false
        contact:
          type: string
          description: "ID du contact associé (retourné en string par l'API)"
          example: "220351"
        user:
          type: string
          description: "ID du négociateur responsable (retourné en string par l'API)"
          example: "3896"
        ranking:
          type: integer
          nullable: true
          description: "Note de la demande"
        last_action:
          type: string
          format: date-time
          nullable: true
          description: "Date de la dernière action"
        auto:
          type: boolean
          description: "Si le rapprochement est automatique"
          example: true
        validated:
          type: boolean
          description: "Si le système a validé le rapprochement automatique"
          example: false
        emailing:
          type: object
          description: "Paramètres d'emailing de la demande"

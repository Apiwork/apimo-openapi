        created_at:
          type: string
          format: date-time
          description: "Date de création. Format retourné par l'API : 'YYYY-MM-DD HH:MM:SS'"
          example: "2010-10-08T15:12:02Z"
        created_by:
          type: string
          description: "ID de l'utilisateur créateur"
          example: "3896"
        updated_at:
          type: string
          format: date-time
          description: "Date de dernière mise à jour. Format retourné par l'API : 'YYYY-MM-DD HH:MM:SS'"
          example: "2014-04-10T09:37:18Z"
        updated_by:
          type: string
          description: "ID du dernier utilisateur modificateur"
          example: "3896"


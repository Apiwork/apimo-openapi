          in: path
          required: true
          schema: { type: integer }
          description: "Identifiant unique du bien"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  description: "URL du bien sur le portail ou site web partenaire"
                  example: "http://www.monportail.fr/bien/12345"
                date:
                  type: string
                  format: date-time
                  description: "Date de publication du bien (format YYYY-MM-DD HH:MM:SS)"
                  example: "2024-10-10T10:45:24Z"
      responses:
        '200':
          description: "Informations de publication mises à jour"
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    example: "http://..."
                  date:
                    type: string
                    example: "2024-10-10T10:45:24Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':

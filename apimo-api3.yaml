openapi: 3.0.3
info:
  title: Apimo API v3
  description: |
    Documentation de l'API Apimo v3 pour les partenaires (portails, CRM, sites web, outils métiers).

    ## Authentification
    HTTP Basic sur **HTTPS uniquement** : identifiant = votre **provider ID**, mot de passe = votre **token**.
    Un filtrage par adresse IP peut être activé sur votre compte partenaire.

    ## Accès aux agences
    Vous n'accédez qu'aux agences ayant activé une connexion avec votre compte partenaire.
    Une connexion peut porter sur une agence, une société, un réseau ou un compte : `GET /provider/feeds` liste vos connexions
    et `GET /agencies` les agences correspondantes. Pour une connexion limitée à un secteur, utilisez un `agency_id`
    de la forme `{agency_id}-{sector_id}`.

    ## Scopes
    Chaque route requiert un ou plusieurs scopes activés sur votre compte (voir `GET /provider`). Sans le scope, l'API répond `403`.

    | Scope | Accès |
    |---|---|
    | `properties` | Lecture des biens |
    | `properties_private` | Champs privés des biens (propriétaire, adresse et coordonnées exactes, prix net vendeur, commentaires privés...), biens de tous les groupes, historique (`logs`) |
    | `properties_write` | Création et modification des biens, photos, médias, documents, descriptions et portails |
    | `properties_delete` | Suppression de photos, médias et documents |
    | `agencies_private` | Paramètres des agences, utilisateurs désactivés, secteurs, portails connectés |
    | `contacts` / `contacts_write` | Lecture / écriture des contacts |
    | `requests` / `requests_write` | Lecture / écriture des demandes de recherche |
    | `leads` / `leads_write` | Lecture / écriture des leads |
    | `actions` / `actions_write` | Lecture / écriture des actions (agenda, historique) |
    | `contracts` / `contracts_write` | Lecture / écriture des contrats |
    | `residences` | Lecture des résidences |
    | `catalogs_private`, `catalogs_general` | Catalogues supplémentaires |

    Les routes et les champs marqués 🔒 **Privé** ne sont accessibles ou remplis qu'avec un scope privé (`properties_private`, `agencies_private`).

    ## Quota
    Chaque appel décompte une requête du quota journalier de votre compte (1 000 par défaut), remis à zéro chaque nuit.
    Au-delà, l'API répond `429`. La création de leads (`POST /agencies/{agency_id}/leads`) et `PUT /agencies/{agency_id}/properties/{property_id}/provider`
    ne sont pas décomptées.

    ## Pagination et synchronisation incrémentale
    Les listes renvoient `total_items` (total avant pagination) et, pour la plupart, `timestamp` (timestamp UNIX de la mise à jour la plus récente de la page).
    Paginez avec `limit` et `offset`. Les listes sont triées par date de mise à jour croissante : pour ne récupérer que les changements,
    rappelez la liste avec le paramètre `timestamp` égal à la valeur reçue lors de la synchronisation précédente.

    ## Formats
    - JSON UTF-8 en entrée (`Content-Type: application/json`) et en sortie.
    - Dates : `YYYY-MM-DD` ; dates-heures : `YYYY-MM-DD HH:MM:SS` (heure de Paris).
    - Les identifiants de valeurs (types, statuts, catégories...) sont définis par les catalogues : `GET /catalogs/{catalog}`.
    - Types : dans les réponses, beaucoup d'identifiants et de valeurs de catalogue sont des chaînes (`"101"`) et les montants décimaux aussi (`"250000.00"`) ; le type de chaque champ est précisé dans les schémas. En entrée, envoyez des nombres.
    - Les paramètres multiples s'écrivent `step[]=1&step[]=2` (`step=1` pour une seule valeur).

    ## Erreurs
    Les erreurs ont la forme `{"status": 403, "title": "Forbidden", "detail": "..."}`.
    Attention : quelques routes renvoient ce corps avec un code HTTP `200` (ressource introuvable sur une route de détail) ; vérifiez la présence de `status`/`detail`.
  version: 3.0.0
  contact: {name: Apimo, url: 'https://apimo.com'}
servers:
- url: https://api.apimo.pro
  description: Serveur de production
- url: https://virtserver.swaggerhub.com/apimo-8ef/Api3/1.0.0
  description: SwaggerHub API Auto Mocking
security:
- basicAuth: []
tags:
- name: Provider
  description: Votre compte partenaire et vos connexions
- name: Catalogs
  description: Référentiels de valeurs (types de biens, statuts, catégories...)
- name: Agencies
  description: Agences, secteurs et portails connectés
- name: Users
  description: Utilisateurs (négociateurs) de l'agence
- name: Properties
  description: Biens immobiliers
- name: Property Media
  description: Photos, médias, documents et descriptions d'un bien
- name: Property Provider
  description: Publication d'un bien sur les portails partenaires
- name: Contacts
  description: Contacts de l'agence (propriétaires, acquéreurs, locataires...)
- name: Requests
  description: Demandes de recherche des contacts et rapprochements
- name: Leads
  description: Demandes entrantes (portails, formulaires)
- name: Actions
  description: Actions (rendez-vous, appels, e-mails, visites...)
- name: Contracts
  description: Contrats (ventes, locations) et écritures
- name: Residences
  description: Résidences et immeubles

paths:

  # ─────────────────────────────────────────
  # PROVIDER
  # ─────────────────────────────────────────
  /provider:
    get:
      tags: [Provider]
      operationId: getProvider
      summary: Get your partner account
      description: |
        Retourne votre compte partenaire et les scopes activés.

        **Scope** : aucun.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Provider'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /provider/feeds:
    get:
      tags: [Provider]
      operationId: listProviderFeeds
      summary: List your active connections
      description: |
        Liste les connexions actives de votre compte (agence, société, réseau ou compte connecté), avec la date du dernier lead envoyé. `timestamp` vaut ici l'heure de l'appel.

        **Scope** : aucun.
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Nombre total d'éléments (avant pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: Timestamp UNIX de la mise à jour la plus récente de la page (à repasser en paramètre `timestamp` pour la synchro incrémentale)
                  feeds:
                    type: array
                    description: Connexions
                    items: {$ref: '#/components/schemas/Feed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ─────────────────────────────────────────
  # CATALOGS
  # ─────────────────────────────────────────
  /catalogs:
    get:
      tags: [Catalogs]
      operationId: listCatalogs
      summary: List the catalogs
      description: |
        Liste les catalogues disponibles. Les catalogues privés n'apparaissent qu'avec les scopes `catalogs_private` / `catalogs_general`.

        **Scope** : aucun.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CatalogList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /catalogs/{catalog_id}:
    get:
      tags: [Catalogs]
      operationId: getCatalog
      summary: Get the values of a catalog
      description: |
        Retourne les valeurs d'un catalogue dans la langue demandée (`culture=all` : toutes les langues).

        **Scope** : aucun.
      parameters:
      - name: catalog_id
        in: path
        required: true
        schema: {type: string, example: property_type}
        description: Nom du catalogue (voir `GET /catalogs`)
      - {$ref: '#/components/parameters/Culture'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CatalogEntry'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ─────────────────────────────────────────
  # AGENCIES
  # ─────────────────────────────────────────
  /agencies:
    get:
      tags: [Agencies]
      operationId: listAgencies
      summary: List your agencies
      description: |
        Liste les agences accessibles via vos connexions, avec leurs utilisateurs actifs, secteurs, partenaires et barèmes.

        **Scope** : aucun.
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - {$ref: '#/components/parameters/Timestamp'}
      - name: active
        in: query
        schema: {type: boolean, default: true}
        description: '`false` : agences désactivées uniquement'
      - name: accountId
        in: query
        schema: {type: integer}
        description: Filtre sur un compte
      - name: with[]
        in: query
        schema:
          type: array
          items:
            type: string
            enum: [providers, parameters, backup]
        description: 'Données supplémentaires : `providers` (partenaires connectés), `parameters` (🔒 privé, `agencies_private` : paramètres de l''agence), `backup` (inclut les utilisateurs désactivés)'
        style: form
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Nombre total d'éléments (avant pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: Timestamp UNIX de la mise à jour la plus récente de la page (à repasser en paramètre `timestamp` pour la synchro incrémentale)
                  agencies:
                    type: array
                    description: Agences
                    items: {$ref: '#/components/schemas/Agency'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}:
    get:
      tags: [Agencies]
      operationId: getAgency
      summary: Get an agency
      description: |
        Retourne une agence (même contenu qu'un élément de `GET /agencies`).

        **Scope** : aucun.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - name: with[]
        in: query
        schema:
          type: array
          items:
            type: string
            enum: [providers, parameters, backup]
        description: 'Données supplémentaires : `providers` (partenaires connectés), `parameters` (🔒 privé, `agencies_private` : paramètres de l''agence), `backup` (inclut les utilisateurs désactivés)'
        style: form
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Agency'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/sectors:
    get:
      tags: [Agencies]
      operationId: listAgencySectors
      summary: 🔒 List the agency's sectors
      description: |
        🔒 **Route privée**

        Liste les secteurs géographiques de la société de l'agence.

        **Scope** : `agencies_private`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Nombre total d'éléments (avant pagination)
                  sectors:
                    type: array
                    description: Secteurs
                    items: {$ref: '#/components/schemas/Sector'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/providers:
    get:
      tags: [Agencies]
      operationId: listAgencyProviders
      summary: 🔒 List the partners connected to the agency
      description: |
        🔒 **Route privée**

        Liste les partenaires (portails, outils) ayant une connexion active avec l'agence, sa société ou son réseau.

        **Scope** : `agencies_private`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items: {$ref: '#/components/schemas/AgencyProvider'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ─────────────────────────────────────────
  # USERS
  # ─────────────────────────────────────────
  /agencies/{agency_id}/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List the users
      description: |
        Liste les utilisateurs de l'agence (actifs et désactivés).

        **Scope** : aucun.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - {$ref: '#/components/parameters/Timestamp'}
      - name: with
        in: query
        schema:
          type: string
          enum: [backup]
        description: '`backup` : détails complets des utilisateurs désactivés'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Nombre total d'éléments (avant pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: Timestamp UNIX de la mise à jour la plus récente de la page (à repasser en paramètre `timestamp` pour la synchro incrémentale)
                  users:
                    type: array
                    description: Utilisateurs
                    items: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/users/{user_id}:
    get:
      tags: [Users]
      operationId: getUser
      summary: Get a user
      description: |
        Retourne un utilisateur de l'agence.

        **Scope** : aucun.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/UserId'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/users/{user_id}/actions:
    get:
      tags: [Users]
      operationId: listUserActions
      summary: List a user's actions
      description: |
        Liste les actions (rendez-vous, appels, e-mails, visites...) d'un utilisateur. Liste paginée, triée par date de mise à jour croissante. Pour une synchronisation incrémentale, repassez dans `timestamp` la valeur `timestamp` reçue lors de l'appel précédent.

        **Scope** : `actions`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/UserId'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - {$ref: '#/components/parameters/Timestamp'}
      - name: type[]
        in: query
        schema:
          type: array
          items: {type: integer}
        description: Types d'action
        style: form
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Nombre total d'éléments (avant pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: Timestamp UNIX de la mise à jour la plus récente de la page (à repasser en paramètre `timestamp` pour la synchro incrémentale)
                  actions:
                    type: array
                    description: Actions
                    items: {$ref: '#/components/schemas/Action'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/users/{user_id}/actions/{year}:
    get:
      tags: [Users]
      operationId: listUserActionsByYear
      summary: List a user's actions for a year
      description: |
        Comme `GET .../users/{user_id}/actions`, limité aux actions datées de l'année indiquée.

        **Scope** : `actions`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/UserId'}
      - {$ref: '#/components/parameters/Year'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - {$ref: '#/components/parameters/Timestamp'}
      - name: type[]
        in: query
        schema:
          type: array
          items: {type: integer}
        description: Types d'action
        style: form
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Nombre total d'éléments (avant pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: Timestamp UNIX de la mise à jour la plus récente de la page (à repasser en paramètre `timestamp` pour la synchro incrémentale)
                  actions:
                    type: array
                    description: Actions
                    items: {$ref: '#/components/schemas/Action'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ─────────────────────────────────────────
  # PROPERTIES
  # ─────────────────────────────────────────
  /agencies/{agency_id}/properties:
    get:
      tags: [Properties]
      operationId: listProperties
      summary: List the properties
      description: |
        Liste les biens de l'agence publiés pour vous. Par défaut : étape 1 (en cours) et groupes 1 et 3. Avec le scope `properties_private`, tous les biens de l'agence et leurs champs privés.

        Plusieurs agences en un appel : `agency_id` = `101_102_103`.

        Liste paginée, triée par date de mise à jour croissante. Pour une synchronisation incrémentale, repassez dans `timestamp` la valeur `timestamp` reçue lors de l'appel précédent.

        **Scope** : `properties`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - name: limit
        in: query
        schema:
          type: integer
          default: 1000
          minimum: 1
          maximum: 1000
        description: Nombre de biens (max 1000)
      - {$ref: '#/components/parameters/Offset'}
      - {$ref: '#/components/parameters/Timestamp'}
      - name: step[]
        in: query
        schema:
          type: array
          items: {type: integer}
        description: 'Étapes (défaut : 1 si ni `step` ni `status`)'
        style: form
        explode: true
      - name: status[]
        in: query
        schema:
          type: array
          items: {type: integer}
        description: Statuts
        style: form
        explode: true
      - name: group[]
        in: query
        schema:
          type: array
          items: {type: integer}
        description: '🔒 **Privé** — Groupes (sans `properties_private` : 1 et 3)'
        style: form
        explode: true
      - name: user_id[]
        in: query
        schema:
          type: array
          items: {type: integer}
        description: Négociateurs
        style: form
        explode: true
      - name: updated
        in: query
        schema: {type: string, example: '2024-06-01 00:00:00'}
        description: Biens modifiés depuis cette date
      - name: sold_at
        in: query
        schema: {type: string, format: date}
        description: Biens vendus depuis cette date
      - name: culture
        in: query
        schema: {type: string, example: fr_FR}
        description: Langue des noms de villes/régions et des libellés de diagnostics
      - name: currency
        in: query
        schema: {type: string, example: USD}
        description: Convertit `price.value` dans cette devise (le prix d'origine est renvoyé dans `price.original_value`)
      - name: with[]
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - advanced
            - advanced_services
            - advanced_proximities
            - options
            - partners
            - graph_infos
            - graph_i18n
            - logs
            - backup
        description: 'Données supplémentaires (ex. `with[]=options&with[]=logs`) : `advanced` (prestations et proximités détaillées), `advanced_services`, `advanced_proximities`, `options` (options de diffusion par portail), `partners` (portails de diffusion), `graph_infos` (image des étiquettes DPE/GES), `graph_i18n` (avec `graph_infos` : image par langue), `logs` (🔒 privé : historique des modifications), `backup` (🔒 privé : tout le bien, y compris photos, documents et médias non publiés)'
        style: form
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Nombre total de biens
                  timestamp:
                    type: integer
                    nullable: true
                    description: Timestamp UNIX de la mise à jour la plus récente de la page
                  processing_time:
                    type: number
                    description: Temps de traitement en secondes
                  properties:
                    type: array
                    items: {$ref: '#/components/schemas/Property'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

    post:
      tags: [Properties]
      operationId: createProperty
      summary: Create or update a property
      description: |
        Crée un bien. Si `id` est fourni, ou si un bien de l'agence porte déjà la `reference` envoyée, ce bien est mis à jour (upsert).

        Erreurs métier : `user` absent à la création (422), `user`/`owner`/`tenant`/`parent` inconnus (400/403), valeur hors liste pour `step`, `status`, `category`, `type` (422), ni `reference` ni `id` (403). Une erreur d'enregistrement est renvoyée en HTTP 200 sous la forme `{"error": "..."}`.

        **Scope** : `properties_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - {$ref: '#/components/schemas/PropertyInput'}
              required: [reference, user]
            example:
              reference: REF-2024-001
              user: 3896
              category: 1
              type: 1
              subtype: 5
              city: Nice
              zipcode: '06000'
              address: 12 rue Gambetta
              area: {unit: 1, value: 65.5}
              rooms: 3
              bedrooms: 2
              price: {value: 350000, currency: EUR, hide: false}
              regulations:
              - {type: 1, value: '152'}
              - {type: 2, value: '18'}
      responses:
        '200':
          description: Bien créé ou mis à jour
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WriteResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/properties/logs:
    get:
      tags: [Properties]
      operationId: listPropertyLogs
      summary: 🔒 List the property change history
      description: |
        🔒 **Route privée**

        Historique des modifications des biens de l'agence.

        **Scope** : `properties_private`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - {$ref: '#/components/parameters/Timestamp'}
      - name: property_id
        in: query
        schema: {type: integer}
        description: Filtre sur un bien
      - name: order
        in: query
        schema:
          type: string
          enum: [asc, desc]
          default: asc
        description: Ordre chronologique
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Nombre total d'éléments (avant pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: Timestamp UNIX de la mise à jour la plus récente de la page (à repasser en paramètre `timestamp` pour la synchro incrémentale)
                  logs:
                    type: array
                    description: Modifications
                    items: {$ref: '#/components/schemas/PropertyLog'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/properties/{property_id}:
    get:
      tags: [Properties]
      operationId: getProperty
      summary: Get a property
      description: |
        Retourne un bien (mêmes paramètres et contenu que la liste). Les mêmes filtres par défaut s'appliquent : pour un bien qui n'est pas à l'étape 1, passez `step`. Bien introuvable : HTTP 200 avec `{"status": 403, "title": "Forbidden", "detail": "Property not found."}`.

        **Scope** : `properties`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/PropertyId'}
      - name: step[]
        in: query
        schema:
          type: array
          items: {type: integer}
        description: 'Étapes acceptées (défaut : 1)'
        style: form
        explode: true
      - name: culture
        in: query
        schema: {type: string, example: fr_FR}
        description: Langue des noms de villes/régions et des libellés de diagnostics
      - name: currency
        in: query
        schema: {type: string, example: USD}
        description: Convertit `price.value` dans cette devise (le prix d'origine est renvoyé dans `price.original_value`)
      - name: with[]
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - advanced
            - advanced_services
            - advanced_proximities
            - options
            - partners
            - graph_infos
            - graph_i18n
            - logs
            - backup
        description: 'Données supplémentaires (ex. `with[]=options&with[]=logs`) : `advanced` (prestations et proximités détaillées), `advanced_services`, `advanced_proximities`, `options` (options de diffusion par portail), `partners` (portails de diffusion), `graph_infos` (image des étiquettes DPE/GES), `graph_i18n` (avec `graph_infos` : image par langue), `logs` (🔒 privé : historique des modifications), `backup` (🔒 privé : tout le bien, y compris photos, documents et médias non publiés)'
        style: form
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Property'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

    put:
      tags: [Properties]
      operationId: updateProperty
      summary: Update a property
      description: |
        Met à jour un bien. Seuls les champs envoyés sont modifiés.

        **Scope** : `properties_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/PropertyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PropertyInput'}
            example:
              price: {value: 340000}
              status: 22
      responses:
        '200':
          description: Bien mis à jour
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WriteResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/properties/{property_id}/crossings:
    get:
      tags: [Properties]
      operationId: listPropertyCrossings
      summary: List the requests matching a property
      description: |
        Liste les demandes de recherche rapprochées avec ce bien (demandes de l'agence, de sa société ou de son réseau). Liste paginée, triée par date de mise à jour croissante. Pour une synchronisation incrémentale, repassez dans `timestamp` la valeur `timestamp` reçue lors de l'appel précédent.

        **Scope** : `properties`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/PropertyId'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - {$ref: '#/components/parameters/Timestamp'}
      - name: step[]
        in: query
        schema:
          type: array
          items: {type: integer}
        description: Étapes du rapprochement
        style: form
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Nombre total d'éléments (avant pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: Timestamp UNIX de la mise à jour la plus récente de la page (à repasser en paramètre `timestamp` pour la synchro incrémentale)
                  crossings:
                    type: array
                    description: Rapprochements
                    items: {$ref: '#/components/schemas/PropertyCrossing'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ─────────────────────────────────────────
  # PROPERTY MEDIA
  # ─────────────────────────────────────────
  /agencies/{agency_id}/properties/{property_id}/pictures:
    post:
      tags: [Property Media]
      operationId: addPropertyPicture
      summary: Add a picture
      description: |
        Ajoute une photo à la fin du bien. Si `reference` est fourni, les autres photos du bien ayant la même référence sont supprimées (remplacement). Formats : JPEG, PNG, GIF, WEBP, BMP ; la photo est redimensionnée à 1920 px sur son plus grand côté.

        **Scope** : `properties_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/PropertyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: Image encodée en base64 (sans préfixe `data:`)
                reference:
                  type: string
                  description: Votre référence unique de la photo
                  example: 69f36ec470396
                comments:
                  type: array
                  description: Légendes par langue (200 caractères max)
                  items: {$ref: '#/components/schemas/I18nComment'}
      responses:
        '200':
          description: Photo ajoutée
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Identifiant de la photo
                    example: 66321497
                  rank:
                    type: integer
                    description: Rang
                    example: 12
                  url:
                    type: string
                    description: URL de la photo
                  width_max:
                    type: integer
                    description: Largeur
                    example: 1920
                  height_max:
                    type: integer
                    description: Hauteur
                    example: 1280
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/properties/{property_id}/pictures/{picture_id}:
    delete:
      tags: [Property Media]
      operationId: deletePropertyPicture
      summary: Delete a picture
      description: |
        Supprime une photo du bien.

        **Scope** : `properties_delete`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/PropertyId'}
      - name: picture_id
        in: path
        required: true
        schema: {type: integer}
        description: Identifiant Apimo de la photo (pas votre référence)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: '`true` si supprimé'
                    example: true
                  error:
                    type: string
                    description: Motif si non supprimé (ex. élément introuvable, renvoyé en HTTP 200)
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/properties/{property_id}/medias:
    post:
      tags: [Property Media]
      operationId: upsertPropertyMedia
      summary: Add or update a media
      description: |
        Ajoute une vidéo ou une visite virtuelle. Si un média du bien porte déjà cette `reference`, il est mis à jour.

        **Scope** : `properties_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/PropertyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference, type, content]
              properties:
                reference:
                  type: string
                  description: Votre référence unique du média
                  example: video-1
                type:
                  type: integer
                  description: 'Type de média : 1 Dailymotion, 2 YouTube, 3 Previsite, 5 Giroptic, 6 VisiteOnline, 7 HDMedia, 8 SmartVisite, 9 HTML, 10 Meilleure Visite, 11 NodalView, 12 Matterport, 13 Immoviewer, 14 Spectando, 15 Vimeo, 16 We Visite, 17 Visitou, 18 enVisite, 19 Clap.video, 20 Ogulo, 21 Rhinov, 22 Klapty, 23 Realisti, 24 Floorplanner, 25 Giraffe 360, 26 EyeSpy360, 27 RICOH360 Tours, 28 Spec.co, 29 DoorInsider, 30 6EmeVue, 31 iFrame, 32 Facebook, 33 Kuula, 35 Poly.cam'
                  example: 2
                content:
                  type: string
                  description: Lien du média ou code HTML (iframe)
                  example: https://youtu.be/JGowo0ARgPo
      responses:
        '200':
          description: Média enregistré
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/properties/{property_id}/medias/{media_id}:
    delete:
      tags: [Property Media]
      operationId: deletePropertyMedia
      summary: Delete a media
      description: |
        Supprime un média du bien.

        **Scope** : `properties_delete`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/PropertyId'}
      - name: media_id
        in: path
        required: true
        schema: {type: integer}
        description: Identifiant Apimo du média (pas votre référence)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: '`true` si supprimé'
                    example: true
                  error:
                    type: string
                    description: Motif si non supprimé (ex. élément introuvable, renvoyé en HTTP 200)
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/properties/{property_id}/documents:
    post:
      tags: [Property Media]
      operationId: addPropertyDocument
      summary: Add a document
      description: |
        Ajoute un document privé au bien (non publié sur internet ni sur l'extranet). Formats : pdf, doc, docx, xls, xlsx, csv, txt, html, jpg, png, gif, webp.

        **Scope** : `properties_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/PropertyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, content]
              properties:
                name:
                  type: string
                  description: Nom du fichier, avec extension
                  example: diagnostics.pdf
                content:
                  type: string
                  description: Fichier encodé en base64
                type_id:
                  type: integer
                  description: Type de document → catalogue `document_type`
      responses:
        '200':
          description: Document ajouté
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Identifiant du document
                    example: 5480610
                  owner:
                    type: integer
                    description: Identifiant du bien
                  name:
                    type: string
                    description: Nom du fichier
                  url:
                    type: string
                    description: URL du document
                  download_url:
                    type: string
                    description: URL de téléchargement
                  filesize:
                    type: string
                    description: Taille en Ko
                    example: '123.45'
                  type_id:
                    type: integer
                    nullable: true
                    description: Type de document
                  internet:
                    type: boolean
                    description: Toujours `false`
                  extranet:
                    type: boolean
                    description: Toujours `false`
                  private:
                    type: boolean
                    description: Toujours `true`
                  created_at:
                    type: string
                    description: Date de création
                    example: '2024-06-15 14:30:00'
                  updated_at:
                    type: string
                    description: Date de modification
                    example: '2024-06-15 14:30:00'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/properties/{property_id}/documents/{document_id}:
    delete:
      tags: [Property Media]
      operationId: deletePropertyDocument
      summary: Delete a document
      description: |
        Supprime un document du bien.

        **Scope** : `properties_delete`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/PropertyId'}
      - name: document_id
        in: path
        required: true
        schema: {type: integer}
        description: Identifiant Apimo du document
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: '`true` si supprimé'
                    example: true
                  error:
                    type: string
                    description: Motif si non supprimé (ex. élément introuvable, renvoyé en HTTP 200)
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/properties/{property_id}/comments:
    post:
      tags: [Property Media]
      operationId: upsertPropertyComments
      summary: Add or update descriptions
      description: |
        Crée ou met à jour la description du bien dans une langue (un objet) ou plusieurs (tableau d'objets). Seuls les champs envoyés sont modifiés ; si tous les champs d'une langue sont vides, la description de cette langue est supprimée. Texte brut (le HTML n'est pas pris en charge).

        **Scope** : `properties_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/PropertyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - {$ref: '#/components/schemas/PropertyCommentInput'}
              - type: array
                items: {$ref: '#/components/schemas/PropertyCommentInput'}
            example:
            - {language: fr, title: Bel appartement, comment: Au cœur de Nice...}
            - {language: en, title: Nice flat, comment: In the heart of Nice...}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Identifiant du bien
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ─────────────────────────────────────────
  # PROPERTY PROVIDER
  # ─────────────────────────────────────────
  /agencies/{agency_id}/properties/{property_id}/providers:
    get:
      tags: [Property Provider]
      operationId: listPropertyProviders
      summary: List the portals of a property
      description: |
        Liste les portails sur lesquels le bien est diffusé ou proposé.

        **Scope** : `properties`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/PropertyId'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        provider:
                          type: string
                          description: Identifiant du portail
                          example: '100'
                        step:
                          type: string
                          enum: ['1', '2', '3', '4']
                          description: 1 diffusé, 2 demande en attente, 3 refusé, 4 retiré
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

    post:
      tags: [Property Provider]
      operationId: setPropertyProvider
      summary: Publish or unpublish a property on a portal
      description: |
        Diffuse (`step` 1, défaut) ou retire (`step` 2, 3 ou 4) le bien sur un portail auquel l'agence est abonnée.

        **Scope** : `properties_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/PropertyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider:
                  type: integer
                  description: Identifiant du portail
                  example: 100
                step:
                  type: integer
                  enum: [1, 2, 3, 4]
                  description: 1 = diffuser, 2/3/4 = retirer
                  default: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Identifiant du bien
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/properties/{property_id}/provider:
    put:
      tags: [Property Provider]
      operationId: updatePropertyPublication
      summary: Send back the listing URL and publication date
      description: |
        Pour un portail : renvoie à Apimo l'URL de l'annonce et/ou sa date de publication sur votre site (au moins un des deux). Le bien doit vous être diffusé. Non décompté du quota.

        **Scope** : `properties`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/PropertyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: URL de l'annonce sur votre site
                  example: https://www.monportail.fr/annonce/12345
                date:
                  type: string
                  description: Date de publication (`YYYY-MM-DD HH:MM:SS` ou timestamp UNIX)
                  example: '2024-06-15 14:30:00'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Identifiant de la diffusion (pas du bien)
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /agencies/{agency_id}/properties/{property_id}/error:
    post:
      tags: [Property Provider]
      operationId: reportPropertyError
      summary: Report a publication error
      description: |
        Signale à l'agence une erreur de publication du bien sur votre portail (message affiché dans Apimo). Envoyez `{}` ou un message vide pour effacer l'erreur. Le bien doit vous être diffusé.

        **Scope** : `properties`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/PropertyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  nullable: true
                  description: Message d'erreur (200 caractères max) ; vide pour effacer
                  example: Missing energy label
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Identifiant du bien
                  message:
                    type: string
                    nullable: true
                    description: Message enregistré
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ─────────────────────────────────────────
  # CONTACTS
  # ─────────────────────────────────────────
  /agencies/{agency_id}/contacts:
    get:
      tags: [Contacts]
      operationId: listContacts
      summary: List the contacts
      description: |
        Liste les contacts de l'agence. Liste paginée, triée par date de mise à jour croissante. Pour une synchronisation incrémentale, repassez dans `timestamp` la valeur `timestamp` reçue lors de l'appel précédent.

        **Scope** : `contacts`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      - {$ref: '#/components/parameters/Timestamp'}
      - name: with
        in: query
        schema:
          type: string
          enum: [extranet_logs]
        description: '`extranet_logs` : consultations de biens sur l''extranet'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_items:
                    type: integer
                    description: Nombre total d'éléments (avant pagination)
                  timestamp:
                    type: integer
                    nullable: true
                    description: Timestamp UNIX de la mise à jour la plus récente de la page (à repasser en paramètre `timestamp` pour la synchro incrémentale)
                  contacts:
                    type: array
                    description: Contacts
                    items: {$ref: '#/components/schemas/Contact'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

    post:
      tags: [Contacts]
      operationId: createContact
      summary: Create a contact
      description: |
        Crée un contact (aucune déduplication : chaque appel crée un nouveau contact).

        **Scope** : `contacts_write`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - {$ref: '#/components/schemas/ContactInput'}
              required: [user]
            example:
              user: 3896
              category: 1
              title: 1
              firstname: Jean
              lastname: Dupont
              email: jean.dupont@example.com
              mobile: '+33611111111'
              city: Nice
              zipcode: '06000'
              language: [fr]
      responses:
        '200':
          description: Contact créé
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WriteResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /agencies/{agency_id}/contacts/{contact_id}:
    get:
      tags: [Contacts]
      operationId: getContact
      summary: Get a contact
      description: |
        Retourne un contact. Contact introuvable : HTTP 200 avec le corps `null`.

        **Scope** : `contacts`.
      parameters:
      - {$ref: '#/components/parameters/AgencyId'}
      - {$ref: '#/components/parameters/ContactId'}
      - name: with
        in: query
        schema:
          type: string
          enum: [extranet_logs]
        description: '`extranet_logs` : consultations de biens sur l''extranet'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Contact'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

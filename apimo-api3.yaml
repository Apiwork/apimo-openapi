      summary: List a contact's actions
      description: |
        Liste les actions liées à un contact, quel que soit l'utilisateur. Liste paginée, triée par date de mise à jour croissante. Pour une synchronisation incrémentale, repassez dans `timestamp` la valeur `timestamp` reçue lors de l'appel précédent.

        **Scope** : `actions`.
      parameters:

        - name: agency_id
          in: path
          required: true
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, default: 10000, maximum: 10000 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: timestamp
          in: query
          schema: { type: integer }

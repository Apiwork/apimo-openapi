                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      crossings:
                        type: array
                        items:
                          type: object
                          properties:
                            request_id:
                              type: integer
                              description: "ID de la demande rapprochée"
                              example: 1234567
                            step_id:
                              type: integer
                              description: "1=À suggérer, 2=Déjà suggéré, 3=Non suggéré"
                              enum: [1, 2, 3]
                              example: 1
                            total:
                              type: string
                              description: "Score de rapprochement de 0 à 100"
                              example: "100"
                            created_at:
                              type: string

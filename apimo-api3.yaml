  /agencies/{agency_id}/leads:
    get:
      tags: [Leads]
      operationId: listLeads
      summary: Retrieve the leads list
      description: |
        Retourne la liste paginée des leads d'une agence.

        **Pagination classique :**
        Utilisez `limit` et `offset` pour parcourir les résultats.
        Le champ `total_items` indique le nombre total de leads.

        **Synchronisation incrémentale (recommandée) :**
        Passez le champ `timestamp` retourné par la dernière réponse pour ne
        récupérer que les leads créés ou modifiés depuis cette date.

      summary: Provider list for a specific property
      description: "Retourne la liste des portails partenaires ayant accès à ce bien."
      parameters:
        - name: agency_id
          in: path
          required: true
          schema: { type: integer }
        - name: property_id
          in: path
          required: true
          schema: { type: integer }
        - name: provider
          in: query
          required: false
          schema: { type: integer }
          description: "Référence unique du portail partenaire"
        - name: step
          in: query
          required: false
          schema: { type: integer, default: 1, enum: [1, 2] }
          description: "1 = actif, 2 = inactif"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider:
                    type: integer

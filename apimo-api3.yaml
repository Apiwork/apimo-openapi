openapi: 3.0.3
info:
  title: Apimo Webservice API
  description: |
    Documentation complète de l'API Apimo pour les prestataires immobiliers.
    Accédez aux agences, biens, contacts, leads et paramètres.

    **Authentification** : HTTP Basic Auth avec `provider_id:token`

    > ⚠️ **Note sur les codes d'erreur** : les codes HTTP documentés (401, 403, 404, 422, 500)
    > suivent les conventions REST standard. En cas de doute, référez-vous aux logs de vos requêtes réelles.
  contact:
    name: Apimo Support
    url: https://apimo.net/fr/contact
  version: 1.0.0
servers:
- url: https://virtserver.swaggerhub.com/apimo-8ef/Api3/1.0.0
  description: SwaggerHub API Auto Mocking
- url: https://api.apimo.pro
  description: Serveur de production
security:
- basicAuth: []
tags:
- name: Catalogs
  description: "Référentiels de valeurs (types de biens, statuts, catégories...)"
- name: Agencies
  description: Agences et business units
- name: Properties
  description: Biens immobiliers (annonces)
- name: Property Media
  description: "Médias attachés à un bien (photos, vidéos, documents)"
- name: Contacts
  description: Contacts clients de l'agence
- name: Leads
  description: Prospects et demandes entrantes
- name: Requests
  description: Demandes de recherche
- name: Actions
  description: Actions et activités
- name: Contracts
  description: "Contrats (mandats, locations...)"
- name: Residences
  description: Résidences et programmes neufs
- name: Users
  description: Utilisateurs et négociateurs de l'agence
paths:
  /catalogs:
    get:
      tags:
      - Catalogs
      summary: Get a list of catalogs
      operationId: listCatalogs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /catalogs/{catalog_id}:
    get:
      tags:
      - Catalogs
      summary: Get a specific catalog
      operationId: getCatalog
      parameters:
      - name: catalog_id
        in: path
        description: "Nom du catalogue (ex: property_type, property_category...)"
        required: true
        schema:
          type: string
      - name: culture
        in: query
        description: Langue des libellés (ISO 639-1)
        required: false
        schema:
          type: string
          example: fr
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies:
    get:
      tags:
      - Agencies
      summary: Retrieve the business units list
      description: |
        Retourne la liste paginée des agences.

        **Pagination classique :**
        Utilisez `limit` et `offset` pour parcourir les résultats.
        Le champ `total_items` dans la réponse indique le nombre total d'agences.
        S'il est supérieur à `offset + limit`, il reste des pages à récupérer.

        Exemple pour parcourir 2500 agences avec limit=1000 :
        - Page 1 : `?limit=1000&offset=0`
        - Page 2 : `?limit=1000&offset=1000`
        - Page 3 : `?limit=1000&offset=2000`
      operationId: listAgencies
      parameters:
      - name: limit
        in: query
        description: "Nombre d'enregistrements à retourner (max: 1000)"
        required: false
        schema:
          maximum: 1000
          type: integer
          default: 1000
      - name: offset
        in: query
        description: Nombre d'enregistrements à ignorer
        required: false
        schema:
          type: integer
          default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/properties:
    get:
      tags:
      - Properties
      summary: Retrieve the properties list
      description: |
        Retourne la liste paginée des biens d'une agence.

        **Pagination classique :**
        Utilisez `limit` et `offset` pour parcourir les résultats.
        Le champ `total_items` dans la réponse indique le nombre total de biens.
        S'il est supérieur à `offset + limit`, il reste des pages à récupérer.

        Exemple pour parcourir 2500 biens avec limit=1000 :
        - Page 1 : `?limit=1000&offset=0`
        - Page 2 : `?limit=1000&offset=1000`
        - Page 3 : `?limit=1000&offset=2000`

        **Synchronisation incrémentale (recommandée) :**
        Passez le champ `timestamp` retourné par la dernière réponse pour ne
        récupérer que les biens créés ou modifiés depuis cette date.
        Idéal pour maintenir une base locale synchronisée sans tout recharger.

        Exemple : `?timestamp=1712000000`
      operationId: listProperties
      parameters:
      - name: agency_id
        in: path
        description: Identifiant unique de l'agence
        required: true
        schema:
          type: integer
      - name: limit
        in: query
        description: "Nombre d'enregistrements à retourner (max: 1000)"
        required: false
        schema:
          maximum: 1000
          type: integer
          default: 1000
      - name: offset
        in: query
        description: Nombre d'enregistrements à ignorer
        required: false
        schema:
          type: integer
          default: 0
      - name: timestamp
        in: query
        description: Retourne les biens créés ou modifiés depuis ce timestamp UNIX
        required: false
        schema:
          type: integer
      - name: step
        in: query
        description: Filtrer par step → voir catalog property_step
        required: false
        schema:
          type: integer
      - name: status
        in: query
        description: Filtrer par statut → voir catalog property_status
        required: false
        schema:
          type: integer
      - name: group
        in: query
        description: Filtrer par groupe → voir catalog property_group
        required: false
        schema:
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_1"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
      - Properties
      summary: Create a new property
      operationId: createProperty
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Property"
        required: true
      responses:
        "200":
          description: Bien créé - retourne l'ID et les dates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_2"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/properties/{property_id}:
    put:
      tags:
      - Properties
      summary: Update a property
      operationId: updateProperty
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      - name: property_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Property"
        required: true
      responses:
        "200":
          description: Bien mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_3"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/properties/{property_id}/pictures:
    post:
      tags:
      - Property Media
      summary: Upload a picture for a property
      operationId: uploadPropertyPicture
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      - name: property_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/property_id_pictures_body"
        required: true
      responses:
        "200":
          description: Photo uploadée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_4"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/properties/{property_id}/pictures/{picture_id}:
    delete:
      tags:
      - Property Media
      summary: Delete a picture from a property
      operationId: deletePropertyPicture
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      - name: property_id
        in: path
        required: true
        schema:
          type: integer
      - name: picture_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Photo supprimée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_5"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/properties/{property_id}/medias:
    post:
      tags:
      - Property Media
      summary: "Add or embed a media (virtual tour, video...)"
      operationId: addPropertyMedia
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      - name: property_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/property_id_medias_body"
        required: true
      responses:
        "200":
          description: Média ajouté
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_6"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/properties/{property_id}/medias/{media_id}:
    delete:
      tags:
      - Property Media
      summary: Delete a media from a property
      operationId: deletePropertyMedia
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      - name: property_id
        in: path
        required: true
        schema:
          type: integer
      - name: media_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Média supprimé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_5"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/properties/{property_id}/documents:
    post:
      tags:
      - Property Media
      summary: Add a document to a property
      operationId: addPropertyDocument
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      - name: property_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/property_id_documents_body"
        required: true
      responses:
        "200":
          description: Document ajouté
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_7"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/properties/{property_id}/documents/{document_id}:
    delete:
      tags:
      - Property Media
      summary: Delete a document from a property
      operationId: deletePropertyDocument
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      - name: property_id
        in: path
        required: true
        schema:
          type: integer
      - name: document_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Document supprimé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_5"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/properties/{property_id}/comments:
    post:
      tags:
      - Property Media
      summary: Add or update a multilingual description
      operationId: upsertPropertyComment
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      - name: property_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/property_id_comments_body"
        required: true
      responses:
        "200":
          description: Commentaire ajouté/mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_6"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/properties/{property_id}/crossings:
    get:
      tags:
      - Properties
      summary: Get matched requests (crossings) for a property
      description: |
        Retourne la liste paginée des rapprochements (demandes matchant ce bien).

        **Synchronisation incrémentale :**
        Passez le champ `timestamp` retourné par la dernière réponse pour ne
        récupérer que les rapprochements mis à jour depuis cette date.
      operationId: listPropertyCrossings
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      - name: property_id
        in: path
        required: true
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        schema:
          maximum: 10000
          type: integer
          default: 10000
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
      - name: timestamp
        in: query
        required: false
        schema:
          type: integer
      - name: step
        in: query
        description: Filtrer par step de rapprochement
        required: false
        schema:
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_8"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/contacts:
    get:
      tags:
      - Contacts
      summary: Retrieve the contacts list
      description: |
        Retourne la liste paginée des contacts d'une agence.

        **Pagination classique :**
        Utilisez `limit` et `offset` pour parcourir les résultats.
        Le champ `total_items` indique le nombre total de contacts.

        **Synchronisation incrémentale (recommandée) :**
        Passez le champ `timestamp` retourné par la dernière réponse pour ne
        récupérer que les contacts créés ou modifiés depuis cette date.
      operationId: listContacts
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        schema:
          maximum: 10000
          type: integer
          default: 10000
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
      - name: timestamp
        in: query
        required: false
        schema:
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_9"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
      - Contacts
      summary: Create a new contact
      operationId: createContact
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Contact"
        required: true
      responses:
        "200":
          description: Contact créé - retourne uniquement l'ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_10"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/leads:
    get:
      tags:
      - Leads
      summary: Retrieve the leads list
      description: |
        Retourne la liste paginée des leads d'une agence.

        **Pagination classique :**
        Utilisez `limit` et `offset` pour parcourir les résultats.
        Le champ `total_items` indique le nombre total de leads.

        **Synchronisation incrémentale (recommandée) :**
        Passez le champ `timestamp` retourné par la dernière réponse pour ne
        récupérer que les leads créés ou modifiés depuis cette date.
      operationId: listLeads
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        schema:
          maximum: 10000
          type: integer
          default: 10000
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
      - name: timestamp
        in: query
        required: false
        schema:
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_11"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
      - Leads
      summary: Create a new lead
      operationId: createLead
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Lead"
        required: true
      responses:
        "200":
          description: Lead created
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/contacts/{contact_id}/actions:
    get:
      tags:
      - Contacts
      summary: Retrieve contact actions history
      description: Retrieve all actions history for a specific contact in an agency.
      operationId: getContactActions
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      - name: contact_id
        in: path
        required: true
        schema:
          type: integer
      - name: user_id
        in: query
        description: Filter actions by a specific user
        required: false
        schema:
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/contacts/{contact_id}/actions/{year}:
    get:
      tags:
      - Contacts
      summary: Retrieve contact actions history filtered by year
      description: Retrieve all actions history for a specific contact in an agency filtered by year.
      operationId: getContactActionsByYear
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      - name: contact_id
        in: path
        required: true
        schema:
          type: integer
      - name: year
        in: path
        required: true
        schema:
          type: integer
          example: 2025
      - name: user_id
        in: query
        description: Filter actions by a specific user
        required: false
        schema:
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/requests:
    get:
      tags:
      - Requests
      summary: Retrieve the requests list
      operationId: listRequests
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
      - Requests
      summary: Create a new request
      operationId: createRequest
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Request created
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/actions:
    post:
      tags:
      - Actions
      summary: Create a new action
      operationId: createAction
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Action created
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /agencies/{agency_id}/contracts:
    get:
      tags:
      - Contracts
      summary: Retrieve the contracts list
      operationId: listContracts
      parameters:
      - name: agency_id
        in: path
        required: true
        schema:
          type: integer

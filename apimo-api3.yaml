  /agencies/{agency_id}/requests:
    get:
      tags: [Requests]
      operationId: listRequests
      summary: Retrieve the requests list
      description: |
        Retourne la liste paginée des demandes de recherche d'une agence.

        **Pagination classique :**
        Utilisez `limit` et `offset` pour parcourir les résultats.
        Le champ `total_items` indique le nombre total de demandes.

        **Synchronisation incrémentale (recommandée) :**
        Passez le champ `timestamp` retourné par la dernière réponse pour ne
        récupérer que les demandes créées ou modifiées depuis cette date.
      parameters:
        - name: agency_id
          in: path
          required: true
          schema: { type: integer }
          description: "Identifiant unique de l'agence"
        - name: limit
          in: query
          schema: { type: integer, default: 10000, maximum: 10000 }
          description: "Nombre d'enregistrements à retourner (max: 10000)"
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
          description: "Nombre d'enregistrements à ignorer"
        - name: timestamp
          in: query
          schema: { type: integer }
          description: "Retourne les demandes créées ou modifiées depuis ce timestamp UNIX"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:

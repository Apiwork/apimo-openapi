          items: { type: integer }
        services:
          type: array
          description: "Services souhaités → voir catalog property_service"
          items: { type: integer }
        activities:
          type: array
          description: "Activités souhaitées → voir catalog property_activity"
          items: { type: integer }
        tags:
          type: array
          description: "Tags → voir catalog tags"
          items: { type: integer }
        tags_customized:
          type: array
          description: "Tags personnalisés de l'agence"
          items:
            type: object
            properties:
              comment: { type: string }
        comment:
          type: string
          description: "Commentaire libre"
          example: ""
        free_criteria:
          type: string

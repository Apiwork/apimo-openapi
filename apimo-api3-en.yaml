  responses:
    Unauthorized:
      description: 401 - Authentification requise. Vérifiez votre provider ID et votre token.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Invalid credentials
    Forbidden:
      description: 403 - Accès refusé. Vous n'avez pas les droits sur cette ressource.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Access denied to this agency
    NotFound:
      description: 404 - Ressource introuvable.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Resource not found
    UnprocessableEntity:
      description: 422 - Données invalides.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Validation failed
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
    InternalServerError:
      description: 500 - Erreur interne du serveur Apimo.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Internal server error
  securitySchemes:
    basicAuth:
      type: http
      description: "Basic Auth : provider_id:token"
      scheme: basic

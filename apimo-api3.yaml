  # ─────────────────────────────────────────
  /agencies/{agency_id}/contacts:
    get:
      tags: [Contacts]
      operationId: listContacts
      summary: Retrieve the contacts list
      description: |
        Retourne la liste paginée des contacts d'une agence.

        **Pagination classique :**
        Utilisez `limit` et `offset` pour parcourir les résultats.
        Le champ `total_items` indique le nombre total de contacts.

        **Synchronisation incrémentale (recommandée) :**
        Passez le champ `timestamp` retourné par la dernière réponse pour ne
        récupérer que les contacts créés ou modifiés depuis cette date.
      parameters:
        - name: agency_id
          in: path
          required: true
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, default: 10000, maximum: 10000 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: timestamp
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'

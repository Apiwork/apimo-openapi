  # ─────────────────────────────────────────
  # RESIDENCES
  # ─────────────────────────────────────────
  /agencies/{agency_id}/residences:
    get:
      tags: [Residences]
      operationId: listResidences
      summary: Retrieve the residences list
      description: |
        Retourne la liste paginée des résidences et immeubles d'une agence.

        **Pagination classique :**
        Utilisez `limit` et `offset` pour parcourir les résultats.
        Le champ `total_items` indique le nombre total de résidences.

        **Synchronisation incrémentale (recommandée) :**
        Passez le champ `timestamp` retourné par la dernière réponse pour ne
        récupérer que les résidences créées ou modifiées depuis cette date.

        > ⚠️ **Note sur les types** : tous les champs numériques (id, floors, lots,
        > longitude, latitude...) sont retournés en **string** par l'API réelle.
      parameters:
        - name: agency_id
          in: path
          required: true
          schema: { type: integer }
          description: "Identifiant unique de l'agence"
        - name: limit
          in: query
          schema: { type: integer, default: 10000, maximum: 10000 }
          description: "Nombre d'enregistrements à retourner (max: 10000)"
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
          description: "Nombre d'enregistrements à ignorer"
        - name: timestamp
          in: query
          schema: { type: integer }
          description: "Retourne les résidences créées ou modifiées depuis ce timestamp UNIX"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      residences:
                        type: array
                        items:
                          type: object
                          description: "Résidence ou immeuble"
                          properties:
                            id:
                              type: string
                              description: "Identifiant unique de la résidence (retourné en string)"
                              example: "35704"
                            user:
                              type: string
                              description: "ID de l'utilisateur responsable (retourné en string)"
                              example: "8265"
                            type:
                              type: string
                              description: "Type de résidence → voir catalog property_building"
                              example: "2"
                            name:
                              type: string
                              description: "Nom de la résidence"
                              example: "LES GLYCINES"
                            reference:
                              type: string
                              nullable: true
                              description: "Référence de la résidence"
                            location_reference:
                              type: string
                              nullable: true
                              description: "Référence de localisation"
                            address:
                              type: string
                              description: "Adresse de la résidence"
                              example: "7, route des Francs Tireurs"
                            address_more:
                              type: string
                              nullable: true
                              description: "Complément d'adresse"
                            city:
                              type: object
                              properties:
                                id:
                                  type: string
                                  description: "ID de la ville (retourné en string)"
                                  example: "183085"
                                name:
                                  type: string
                                  example: "Aubonne"
                                zipcode:
                                  type: string
                                  example: "1170"
                            district:
                              type: object
                              nullable: true
                              properties:
                                id:
                                  type: string
                                  example: "18"
                                name:
                                  type: string
                                  example: "Centre"
                            country:
                              type: string
                              description: "Code pays ISO 3166-1 alpha-2"
                              example: "CH"
                            longitude:
                              type: string
                              description: "Longitude GPS (retournée en string)"
                              example: "6.39172"
                            latitude:
                              type: string
                              description: "Latitude GPS (retournée en string)"
                              example: "46.49536"
                            construction_year:
                              type: string
                              nullable: true
                              description: "Année de construction"
                              example: "2006"
                            standing:
                              type: string
                              nullable: true
                              description: "Standing → voir catalog property_standing"
                              example: "4"
                            floors:
                              type: string
                              nullable: true
                              description: "Nombre d'étages de l'immeuble (retourné en string)"
                              example: "4"
                            lots:
                              type: string
                              nullable: true
                              description: "Nombre de lots (retourné en string)"
                              example: "12"
                            total_shares:
                              type: string
                              nullable: true
                              description: "Total des tantièmes"
                            code:
                              type: string
                              nullable: true
                              description: "Code d'entrée de la résidence"
                            code_at:
                              type: string
                              format: date-time
                              nullable: true
                              description: "Date du dernier code d'entrée"
                            comment:
                              type: string
                              nullable: true
                              description: "Commentaire libre"
                            contacts:
                              type: array
                              description: "Contacts liés à la résidence (copropriétaires, gardiens...)"
                              items:
                                type: object
                                properties:
                                  contact:
                                    type: string
                                    description: "ID du contact"
                                    example: "4753321"
                                  type:
                                    type: string
                                    description: "Type de lien avec la résidence"
                                    example: "3"
                                  shares:
                                    type: string
                                    nullable: true
                                    description: "Tantièmes du contact"
                                    example: "34.00"
                                  property:
                                    type: object
                                    nullable: true
                                    description: "Bien associé au contact dans la résidence"
                                    properties:
                                      rooms:
                                        type: string
                                        example: "3"
                                      bedrooms:
                                        type: string
                                        example: "2"
                                      subtype:
                                        type: string
                                        example: "63"
                                      area:
                                        type: string
                                        example: "300.00"
                                      floor:
                                        type: object
                                        properties:
                                          type:
                                            type: integer
                                            example: 23
                                          value:
                                            type: integer
                                            nullable: true
                                  comment:
                                    type: string
                                    nullable: true
                                    description: "Commentaire sur le contact"
                                    example: "test"
                            created_at:
                              type: string
                              format: date-time
                              description: "Date de création. Format retourné : 'YYYY-MM-DD HH:MM:SS'"
                              example: "2015-11-17T14:13:44Z"
                            updated_at:
                              type: string
                              format: date-time
                              description: "Date de dernière mise à jour. Format retourné : 'YYYY-MM-DD HH:MM:SS'"
                              example: "2017-04-07T11:12:06Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'


  /agencies/{agency_id}/properties/{property_id}/crossings:
    get:
      tags: [Properties]
      operationId: listPropertyCrossings
      summary: Get matched requests (crossings) for a property
      description: |
        Retourne la liste paginée des rapprochements (demandes matchant ce bien).

        **Synchronisation incrémentale :**
        Passez le champ `timestamp` retourné par la dernière réponse pour ne
        récupérer que les rapprochements mis à jour depuis cette date.
      parameters:
        - name: agency_id
          in: path
          required: true
          schema: { type: integer }
        - name: property_id
          in: path
          required: true
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, default: 10000, maximum: 10000 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: timestamp
          in: query
          schema: { type: integer }
        - name: step
          in: query
          schema: { type: integer }
          description: "Filtrer par step de rapprochement"
      responses:
